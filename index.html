<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies I've Watched Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Chart.js สำหรับวาดกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --accent-gradient: linear-gradient(135deg, #60a5fa, #3b82f6);
            --accent-color: #60a5fa;
            --success-color: #34d399;
            --star-color: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            
            /* Glassmorphism settings */
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --blur-amount: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Noto Sans Thai', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            padding: 40px 20px;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.85) 0%, rgba(2, 6, 23, 0.95) 100%);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount)) saturate(150%);
            -webkit-backdrop-filter: blur(var(--blur-amount)) saturate(150%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* ---------------- Header ---------------- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 30px; margin-bottom: 35px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); flex-wrap: wrap; gap: 20px;
        }
        .logo-title h1 { font-size: 2.2rem; font-weight: 700; display: flex; align-items: center; gap: 12px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .logo-title h1 i { color: var(--accent-color); }
        .sync-box { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .btn-action {
            background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 8px;
            transition: all 0.3s; backdrop-filter: blur(10px);
        }
        .btn-action:hover { background: var(--text-main); color: #0f172a; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 255, 255, 0.15); }

        /* ---------------- Add Form ---------------- */
        .add-form-panel { padding: 30px; margin-bottom: 35px; display: none; }
        .add-form-panel.show { display: block; animation: slideDown 0.4s forwards; }
        @keyframes slideDown { from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);} }
        .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 15px; align-items: end; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; color: var(--text-muted); }
        .form-group input, .form-group select {
            padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.4); color: #fff; outline: none;
        }

        /* ---------------- Stats Grid ---------------- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .stat-card { padding: 24px; display: flex; align-items: center; gap: 20px; transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-icon {
            width: 56px; height: 56px; border-radius: 16px; background: rgba(255, 255, 255, 0.1);
            color: var(--text-main); display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 0 2px 10px rgba(255,255,255,0.1);
        }
        .stat-info h3 { font-size: 2rem; font-weight: 700; line-height: 1.1; }
        .stat-info p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

        /* ---------------- Charts Section ---------------- */
        .charts-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            margin-bottom: 35px;
        }
        .chart-box {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 300px;
        }
        .chart-box.full-width {
            grid-column: 1 / -1;
        }
        .chart-header {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-header i { color: var(--accent-color); }
        .canvas-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
        }
        @media (max-width: 900px) {
            .charts-container { grid-template-columns: 1fr; }
        }

        /* ---------------- Controls & Filters ---------------- */
        .controls-panel { padding: 20px 25px; margin-bottom: 35px; display: flex; flex-direction: column; gap: 20px; }
        .year-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .year-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: rgba(0, 0, 0, 0.3); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.05);
            padding: 10px 24px; border-radius: 30px; cursor: pointer; font-weight: 500; white-space: nowrap; transition: all 0.3s;
        }
        .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.1); }
        .tab-btn.active { background: var(--text-main); color: #0f172a; font-weight: 600; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2); }

        .filter-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .search-box { position: relative; flex: 1; min-width: 260px; }
        .search-box input {
            width: 100%; padding: 12px 15px 12px 42px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); background-color: rgba(0, 0, 0, 0.4);
            color: var(--text-main); outline: none; transition: all 0.3s; font-size: 0.95rem;
        }
        .search-box input:focus { border-color: var(--accent-color); background-color: rgba(0, 0, 0, 0.6); }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        
        .filter-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .filter-group select {
            padding: 10px 16px; border-radius: 12px; background: rgba(0, 0, 0, 0.4); color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1); outline: none; cursor: pointer; font-weight: 500;
        }

        .view-btn-group { display: flex; background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 4px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .view-btn { background: none; border: none; color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
        .view-btn.active { background: rgba(255, 255, 255, 0.2); color: var(--text-main); }

        /* ---------------- Movie Grid ---------------- */
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .movie-card {
            background: var(--glass-bg); backdrop-filter: blur(10px); border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05); padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.3s;
        }
        .movie-card:hover { transform: translateY(-5px); border-color: rgba(96,165,250,0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .movie-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .movie-title { font-size: 1.1rem; font-weight: 600; line-height: 1.4; color: #fff; }
        .release-year { font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 20px; color: #cbd5e1; margin-left: 8px; white-space: nowrap; }
        .movie-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; color: var(--text-muted); }

        /* ---------------- Table View ---------------- */
        .table-wrapper { width: 100%; overflow-x: auto; display: none; padding: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); }
        tr { transition: background 0.2s; }
        tr:hover { background: rgba(255, 255, 255, 0.05); }
        td.table-title { font-weight: 500; color: #fff; font-size: 1rem; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1 / -1; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-title">
            <h1><i class="fa-solid fa-clapperboard"></i> Cinema Tracker</h1>
        </div>
        <div class="sync-box">
            <span id="statusText" style="font-size: 0.85rem; color: var(--text-muted); margin-right: 10px;">รอการซิงค์...</span>
            <button class="btn-action" style="background: rgba(16, 185, 129, 0.2); color: #34d399; border-color: rgba(16, 185, 129, 0.3);" onclick="toggleAddForm()">
                <i class="fa-solid fa-plus"></i> เพิ่มหนัง
            </button>
            <button class="btn-action" onclick="fetchLiveData()">
                <i class="fa-solid fa-cloud-arrow-down"></i> ซิงค์ข้อมูลชีต
            </button>
        </div>
    </header>

    <div id="addFormPanel" class="add-form-panel glass-panel">
        <h3 style="margin-bottom: 20px;"><i class="fa-solid fa-film"></i> เพิ่มรายการภาพยนตร์</h3>
        <form id="addMovieForm" class="form-grid" onsubmit="addNewMovie(event)">
            <div class="form-group"><label>ชื่อภาพยนตร์</label><input type="text" id="inputTitle" required autocomplete="off"></div>
            <div class="form-group"><label>ปีที่ฉาย</label><input type="text" id="inputReleaseYear" required autocomplete="off"></div>
            <div class="form-group"><label>วันที่ดู</label><input type="text" id="inputDateWatched" required autocomplete="off"></div>
            <div class="form-group">
                <label>บันทึกลงหมวดหมู่</label>
                <select id="inputTargetYear">
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                </select>
            </div>
            <button type="submit" class="btn-action" style="height: 46px; justify-content: center; background: var(--text-main); color: #000;">
                บันทึก
            </button>
        </form>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
        <div class="stat-card glass-panel">
            <div class="stat-icon"><i class="fa-solid fa-ticket"></i></div>
            <div class="stat-info"><h3 id="statTotal">0</h3><p>จำนวนหนังทั้งหมด</p></div>
        </div>
        <div class="stat-card glass-panel">
            <div class="stat-icon"><i class="fa-regular fa-calendar-check"></i></div>
            <div class="stat-info"><h3 id="statActiveTabCount">0</h3><p>เรื่องในหมวดนี้</p></div>
        </div>
        <div class="stat-card glass-panel">
            <div class="stat-icon"><i class="fa-solid fa-fire-flame-curved"></i></div>
            <div class="stat-info"><h3 id="statTopYear">-</h3><p>ปีที่ดูเยอะที่สุด</p></div>
        </div>
    </div>

    <!-- Advanced Charts Section -->
    <div class="charts-container">
        <!-- Chart 1: Bar Chart (Monthly) -->
        <div class="chart-box glass-panel">
            <div class="chart-header"><i class="fa-solid fa-chart-column"></i> สถิติการดูภาพยนตร์รายเดือน</div>
            <div class="canvas-wrapper">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>
        
        <!-- Chart 2: Doughnut Chart (Ratings) -->
        <div class="chart-box glass-panel">
            <div class="chart-header"><i class="fa-solid fa-chart-pie"></i> สัดส่วนการให้คะแนน</div>
            <div class="canvas-wrapper">
                <canvas id="ratingChart"></canvas>

        <!-- Chart 3: Horizontal Bar Chart (Decades) -->
        <div class="chart-box glass-panel full-width">
            <div class="chart-header"><i class="fa-solid fa-timeline"></i> ยุคของภาพยนตร์ที่ดู (Decade Tracker)</div>
            <div class="canvas-wrapper" style="height: 250px;">
                <canvas id="decadeChart"></canvas>

    <div class="controls-panel glass-panel">
        <div class="year-tabs" id="yearTabs">
            <button class="tab-btn active" onclick="selectYear('ALL')">ทั้งหมด</button>
            <button class="tab-btn" onclick="selectYear('2026')">2026</button>
            <button class="tab-btn" onclick="selectYear('2025')">2025</button>
            <button class="tab-btn" onclick="selectYear('2024')">2024</button>
            <button class="tab-btn" onclick="selectYear('2023')">2023</button>

                    <option value="DATE_DESC">เรียงลำดับในไฟล์</option>
                    <option value="TITLE_ASC">ชื่อเรื่อง (A-Z)</option>
                    <option value="RELEASE_DESC">ปีที่ฉาย (ใหม่สุด)</option>
                </select>
                <div class="view-btn-group">
                    <button class="view-btn active" id="btnGridView" onclick="switchView('GRID')"><i class="fa-solid fa-border-all"></i></button>

                <tr><th style="width: 60px;">#</th><th>ชื่อภาพยนตร์</th><th>ปีที่ฉาย</th><th>วันที่รับชม</th></tr>
            </thead>
            <tbody id="movieTableBody"></tbody>
        </table>

</div>

<script>
    const SHEET_IDS = {
        '2026': '1ZdV8YXXQAqXegMwJl3PpqHItTI6GXyx8RU2ZQmhF7Tg', 
        '2025': '1dNxvYfZUN-XBryNf_QB9DnaBM5Fc8TRg4k9Niv1y1hA',
        '2024': '10uRvpV3fI4tcGmCoTS4cSpCd32wGIEIuR6RpFRh3h68',
        '2023': '1TjOzc2WY9VOu-PujXk7QJj-G57Y1hcvPof7i6imsHy0',
        '2022': '1CTjHtjL3D0P5wn8vq8VX10gvy3xGaLog_Kv-z7kC9Bw',
        '2021': '1OZBdY4QRWriPuybGGxD4Wk2LomVcuuYCYICaK_b7oKo'
    };

    let allMoviesData = {};
    let activeYear = 'ALL';
    let activeView = 'GRID';
    
    // ตัวแปรกราฟ
    let chartMonthly = null;
    let chartRating = null;
    let chartDecade = null;

    // ตั้งค่าพื้นฐานให้ Chart.js เข้ากับธีม Dark
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.font.family = "'Poppins', 'Noto Sans Thai', sans-serif";
    Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(15, 23, 42, 0.9)';
    Chart.defaults.plugins.tooltip.padding = 12;

    function toggleAddForm() { document.getElementById('addFormPanel').classList.toggle('show'); }

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        const result = [];
        for (let line of lines) {
            if (!line.trim()) continue;
            let row = [], insideQuotes = false, entry = '';
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    if (insideQuotes && line[i+1] === '"') { entry += '"'; i++; } 
                    else { insideQuotes = !insideQuotes; }
                } else if (char === ',' && !insideQuotes) {
                    row.push(entry.trim()); entry = '';
                } else { entry += char; }
            }
            row.push(entry.trim());
            result.push(row);
        }
        return result;
    }

    function extractMoviesFromCSV(csvRows, year) {
        let headerIdx = -1;
        let colMap = { title: 2, releaseYear: 3, dateWatched: 4, rating: 5 };

        for (let i = 0; i < Math.min(csvRows.length, 6); i++) {
            const row = csvRows[i];
            if (!row) continue;
            for (let j = 0; j < row.length; j++) {
                const cell = row[j].toLowerCase();
                if (cell.includes('name') || cell.includes('ชื่อเรื่อง') || cell.includes('title')) { headerIdx = i; colMap.title = j; }
                if (cell.includes('release') || (cell.includes('ปี') && !cell.includes('ดู'))) { colMap.releaseYear = j; }
                if (cell.includes('date') || cell.includes('วันที่') || cell.includes('ดู')) { colMap.dateWatched = j; }
                if (cell.includes('rating') || cell.includes('คะแนน') || cell.includes('⭐')) { colMap.rating = j; }
            }
            if (headerIdx !== -1) break;
        }

        const startRow = headerIdx !== -1 ? headerIdx + 1 : 3;
        const movies = [];

        for (let i = startRow; i < csvRows.length; i++) {
            const row = csvRows[i];
            if (!row || row.length <= Math.max(colMap.title, colMap.releaseYear, colMap.dateWatched)) continue;
            
            const title = row[colMap.title] ? row[colMap.title].replace(/^"|"$/g, '').trim() : '';
            if (!title || title.toLowerCase() === 'name' || title === 'หนังที่ฉันดู' || title === 'ชื่อเรื่อง') continue;

            const relYear = row[colMap.releaseYear] ? row[colMap.releaseYear].replace(/^"|"$/g, '').trim() : year;
            const dateWatched = row[colMap.dateWatched] ? row[colMap.dateWatched].replace(/^"|"$/g, '').trim() : '-';
            const rawRating = row[colMap.rating] ? row[colMap.rating].replace(/^"|"$/g, '').trim() : '';

            // ดึงเฉพาะดาวเพื่อใช้ทำกราฟสัดส่วนคะแนน
            let ratingNum = 0;
            if (rawRating) {
                const stars = rawRating.match(/[⭐★☆✰]/g);
                if (stars) {
                    let count = 0;
                    for (let c of rawRating.replace(/["']/g, '')) {
                        if (c === '⭐' || c === '★' || c === '⭐️') count++;
                        else break;
                    }
                    ratingNum = count <= 5 ? count : 0;
                }
            }

            movies.push({ t: title, y: relYear || year, d: dateWatched, r: ratingNum, yearWatched: year, isCustom: false });
        }
        return movies;
    }

    async function fetchLiveData() {
        const statusText = document.getElementById('statusText');
        statusText.innerHTML = '<i class="fa-solid fa-rotate fa-spin" style="color:var(--accent-color);"></i> โหลดข้อมูลชีต...';
        
        let savedCustomData = JSON.parse(localStorage.getItem('custom_movies_data')) || {};
        let successCount = 0;
        const fetchedData = {};

        for (const [yr, sid] of Object.entries(SHEET_IDS)) {
            const url = `https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:csv`;
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const csvText = await res.text();
                    let sheetMovies = extractMoviesFromCSV(parseCSV(csvText), yr);
                    if (savedCustomData[yr]) sheetMovies = savedCustomData[yr].concat(sheetMovies);
                    fetchedData[yr] = sheetMovies;
                    successCount++;
                }
            } catch (err) {
                if (savedCustomData[yr]) fetchedData[yr] = savedCustomData[yr];
            }
        }

        allMoviesData = fetchedData;
        statusText.innerHTML = `<i class="fa-solid fa-check" style="color:var(--success-color);"></i> ข้อมูลชีตอัปเดตแล้ว`;
        setTimeout(() => statusText.innerHTML = 'พร้อมใช้งาน', 3000);

        updateStats();
        applyFilters();
    }

    function addNewMovie(event) {
        event.preventDefault();
        const title = document.getElementById('inputTitle').value.trim();
        const releaseYear = document.getElementById('inputReleaseYear').value.trim();
        const dateWatched = document.getElementById('inputDateWatched').value.trim();
        const targetYear = document.getElementById('inputTargetYear').value;

        const newMovie = { t: title, y: releaseYear, d: dateWatched, r: 0, yearWatched: targetYear, isCustom: true };
        if (!allMoviesData[targetYear]) allMoviesData[targetYear] = [];
        allMoviesData[targetYear].unshift(newMovie);

        let savedCustomData = JSON.parse(localStorage.getItem('custom_movies_data')) || {};
        if (!savedCustomData[targetYear]) savedCustomData[targetYear] = [];
        savedCustomData[targetYear].unshift(newMovie);
        localStorage.setItem('custom_movies_data', JSON.stringify(savedCustomData));

        document.getElementById('addMovieForm').reset();
        toggleAddForm();
        selectYear(targetYear);
    }

    function selectYear(yr) {
        activeYear = yr;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === (yr === 'ALL' ? 'ทั้งหมด' : yr));
        });
        updateStats();
        applyFilters();
    }

    function switchView(view) {
        activeView = view;
        document.getElementById('btnGridView').classList.toggle('active', view === 'GRID');
        document.getElementById('btnTableView').classList.toggle('active', view === 'TABLE');
        document.getElementById('moviesGrid').style.display = view === 'GRID' ? 'grid' : 'none';
        document.getElementById('tableWrapper').style.display = view === 'TABLE' ? 'block' : 'none';
    }

    function updateStats() {
        let allList = [], activeList = [];
        const yearCounts = {};
        for (const [yr, list] of Object.entries(allMoviesData)) {
            allList = allList.concat(list);
            if (activeYear === 'ALL' || activeYear === yr) activeList = activeList.concat(list);
            if (list.length > 0) yearCounts[yr] = list.length;
        }
        document.getElementById('statTotal').innerText = allList.length;
        document.getElementById('statActiveTabCount').innerText = activeList.length;

        let maxYr = '-', maxCount = 0;
        for (const [yr, count] of Object.entries(yearCounts)) {
            if (count > maxCount) { maxCount = count; maxYr = `${yr} (${count})`; }
        }
        document.getElementById('statTopYear').innerText = maxYr;
    }

    // ---------------- วาดกราฟสถิติ (Chart.js) ----------------
    function drawCharts(movies) {
        // เตรียมข้อมูลเดือน
        const monthsMap = {'jan':0, 'ม.ค.':0, 'feb':1, 'ก.พ.':1, 'mar':2, 'มี.ค.':2, 'apr':3, 'เม.ย.':3, 'may':4, 'พ.ค.':4, 'jun':5, 'มิ.ย.':5, 'jul':6, 'ก.ค.':6, 'aug':7, 'ส.ค.':7, 'sep':8, 'ก.ย.':8, 'oct':9, 'ต.ค.':9, 'nov':10, 'พ.ย.':10, 'dec':11, 'ธ.ค.':11};
        const monthCounts = new Array(12).fill(0);
        
        // เตรียมข้อมูลดาว
        const ratingCounts = {5:0, 4:0, 3:0, 2:0, 1:0, unrated:0};

        // เตรียมข้อมูลยุค (Decade)
        const decadeCounts = {};

        movies.forEach(m => {
            // นับเดือน
            if(m.d && m.d !== '-') {
                const monthStr = m.d.substring(0,3).toLowerCase();
                if(monthsMap[monthStr] !== undefined) {
                    monthCounts[monthsMap[monthStr]]++;
                }
            }
            
            // นับดาว
            if (m.r >= 1 && m.r <= 5) ratingCounts[m.r]++;
            else ratingCounts.unrated++;

            // นับยุค
            const yearNum = parseInt(m.y);
            if (!isNaN(yearNum) && yearNum > 1900 && yearNum < 2100) {
                const decade = Math.floor(yearNum / 10) * 10;
                decadeCounts[decade] = (decadeCounts[decade] || 0) + 1;
            }
        });

        // 1. วาดกราฟแท่งรายเดือน
        if(chartMonthly) chartMonthly.destroy();
        const ctxMonthly = document.getElementById('monthlyChart').getContext('2d');
        const gradientBlue = ctxMonthly.createLinearGradient(0, 0, 0, 400);
        gradientBlue.addColorStop(0, 'rgba(96, 165, 250, 0.8)');
        gradientBlue.addColorStop(1, 'rgba(59, 130, 246, 0.2)');

        chartMonthly = new Chart(ctxMonthly, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                datasets: [{
                    label: 'จำนวนเรื่อง',
                    data: monthCounts,
                    backgroundColor: gradientBlue,
                    borderRadius: 6,
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { stepSize: 1 } },
                    x: { grid: { display: false } }
                }
            }
        });

        // 2. วาดกราฟโดนัท เรตติ้ง
        if(chartRating) chartRating.destroy();
        const ctxRating = document.getElementById('ratingChart').getContext('2d');
        chartRating = new Chart(ctxRating, {
            type: 'doughnut',
            data: {
                labels: ['5 ดาว', '4 ดาว', '3 ดาว', '2 ดาว', '1 ดาว', 'ไม่ได้ให้คะแนน'],
                datasets: [{
                    data: [ratingCounts[5], ratingCounts[4], ratingCounts[3], ratingCounts[2], ratingCounts[1], ratingCounts.unrated],
                    backgroundColor: [
                        '#fbbf24', // 5 Star
                        '#94a3b8', // 4 Star
                        '#d97706', // 3 Star
                        '#ef4444', // 2 Star
                        '#7f1d1d', // 1 Star
                        'rgba(255,255,255,0.1)' // Unrated
                    ],
                    borderWidth: 2,
                    borderColor: '#0f172a'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: { position: 'right', labels: { boxWidth: 12, usePointStyle: true } }
                }
            }
        });

        // 3. วาดกราฟแท่งแนวนอน ยุคของหนัง
        if(chartDecade) chartDecade.destroy();
        const ctxDecade = document.getElementById('decadeChart').getContext('2d');
        
        const sortedDecades = Object.keys(decadeCounts).sort();
        const decadeLabels = sortedDecades.map(d => `${d}s`);
        const decadeData = sortedDecades.map(d => decadeCounts[d]);

        const gradientGreen = ctxDecade.createLinearGradient(0, 0, 800, 0);
        gradientGreen.addColorStop(0, 'rgba(52, 211, 153, 0.8)');
        gradientGreen.addColorStop(1, 'rgba(16, 185, 129, 0.2)');

        chartDecade = new Chart(ctxDecade, {
            type: 'bar',
            data: {
                labels: decadeLabels.length > 0 ? decadeLabels : ['No Data'],
                datasets: [{
                    label: 'จำนวนเรื่อง',
                    data: decadeData.length > 0 ? decadeData : [0],
                    backgroundColor: gradientGreen,
                    borderRadius: 6
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { stepSize: 1 } },
                    y: { grid: { display: false } }
                }
            }
        });
    }

    function applyFilters() {
        let movies = [];
        for (const [yr, list] of Object.entries(allMoviesData)) {
            if (activeYear === 'ALL' || activeYear === yr) movies = movies.concat(list);
        }

        // วาดกราฟใหม่จากข้อมูลที่ Filter แล้ว
        drawCharts(movies);

        const search = document.getElementById('searchInput').value.toLowerCase();
        const sort = document.getElementById('sortSelect').value;

        if (search) movies = movies.filter(m => m.t.toLowerCase().includes(search));

        movies.sort((a, b) => {
            if (sort === 'TITLE_ASC') return a.t.localeCompare(b.t);
            if (sort === 'RELEASE_DESC') return (b.y || 0) - (a.y || 0);
            return 0; // Default
        });

        renderMovies(movies);
    }

    function renderMovies(movies) {
        const grid = document.getElementById('moviesGrid');
        const tbody = document.getElementById('movieTableBody');
        grid.innerHTML = ''; tbody.innerHTML = '';

        if (movies.length === 0) {
            grid.innerHTML = `<div class="empty-state glass-panel" style="grid-column: 1/-1;"><i class="fa-solid fa-film fa-3x" style="opacity:0.2; margin-bottom:15px;"></i><p style="font-weight: 500;">No movies found.</p></div>`;
            return;
        }

        movies.forEach((m, idx) => {
            const customTag = m.isCustom ? `<span style="font-size:0.6rem; background:rgba(255,255,255,0.2); padding:2px 6px; border-radius:4px; margin-left:4px;">เพิ่มเอง</span>` : '';
            
            // Grid Card
            const card = document.createElement('div');
            card.className = 'movie-card fade-in';
            card.style.animationDelay = `${Math.min(idx * 0.02, 0.5)}s`;
            card.innerHTML = `
                <div>
                    <div class="movie-header">
                        <div class="movie-title">${m.t} ${customTag}</div>
                        <span class="release-year">${m.y}</span>
                    </div>
                </div>
                <div class="movie-meta">
                    <span><i class="fa-regular fa-calendar-check" style="color:var(--accent-color); margin-right:5px;"></i>${m.d} (${m.yearWatched})</span>
                </div>
            `;
            grid.appendChild(card);

            // Table Row
            const tr = document.createElement('tr');
            tr.className = 'fade-in';
            tr.style.animationDelay = `${Math.min(idx * 0.01, 0.3)}s`;
            tr.innerHTML = `
                <td style="color: var(--text-muted);">${idx + 1}</td>
                <td class="table-title">${m.t} ${customTag}</td>
                <td>${m.y}</td>
                <td style="color: var(--text-muted);">${m.d}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = () => { fetchLiveData(); };
</script>
