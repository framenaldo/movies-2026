<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies I've Watched Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --star-color: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header & Status */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-title h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
        }

        .logo-title h1 i {
            color: var(--accent-color);
        }

        .sync-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background-color: #064e3b;
            color: #34d399;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-sync {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-sync:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Stat Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .stat-info h3 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Controls Section */
        .controls-panel {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .year-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background-color: #334155;
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-color);
        }

        .filter-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-main);
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
        }

        .view-btn-group {
            display: flex;
            background-color: #0f172a;
            border-radius: 8px;
            padding: 2px;
            border: 1px solid var(--border-color);
        }

        .view-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .view-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* Movie Grid & Cards */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .movie-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .movie-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
            color: #ffffff;
        }

        .release-year {
            font-size: 0.8rem;
            background-color: #334155;
            padding: 2px 8px;
            border-radius: 12px;
            color: var(--text-muted);
            margin-left: 8px;
            white-space: nowrap;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stars {
            color: var(--star-color);
            letter-spacing: 2px;
        }

        /* Table View */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #0f172a;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
        }

        tr:hover {
            background-color: rgba(255,255,255,0.02);
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header>
        <div class="logo-title">
            <h1><i class="fa-solid fa-film"></i> Movies Watched Tracker</h1>
        </div>
        <div class="sync-box">
            <div id="statusBadge" class="status-badge">
                <i class="fa-solid fa-circle-check"></i> <span id="statusText">กำลังดึงข้อมูล...</span>
            </div>
            <button class="btn-sync" onclick="fetchLiveData()">
                <i class="fa-solid fa-rotate"></i> Sync ข้อมูล
            </button>
        </div>
    </header>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-clapperboard"></i></div>
            <div class="stat-info">
                <h3 id="statTotal">0</h3>
                <p>จำนวนหนังทั้งหมด</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-star"></i></div>
            <div class="stat-info">
                <h3 id="statAvgRating">-</h3>
                <p>คะแนนเฉลี่ย</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-trophy"></i></div>
            <div class="stat-info">
                <h3 id="statFiveStar">0</h3>
                <p>หนัง 5 ดาว (สุดยอด)</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-calendar-days"></i></div>
            <div class="stat-info">
                <h3 id="statTopYear">-</h3>
                <p>ปีที่ดูหนังมากที่สุด</p>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-panel">
        <div class="year-tabs" id="yearTabs">
            <button class="tab-btn active" onclick="selectYear('ALL')">ทั้งหมด</button>
            <button class="tab-btn" onclick="selectYear('2026')">2026</button>
            <button class="tab-btn" onclick="selectYear('2025')">2025</button>
            <button class="tab-btn" onclick="selectYear('2024')">2024</button>
            <button class="tab-btn" onclick="selectYear('2023')">2023</button>
            <button class="tab-btn" onclick="selectYear('2022')">2022</button>
            <button class="tab-btn" onclick="selectYear('2021')">2021</button>
        </div>

        <div class="filter-row">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อหนัง..." oninput="applyFilters()">
            </div>
            
            <div class="filter-group">
                <select id="ratingFilter" onchange="applyFilters()">
                    <option value="ALL">คะแนนทั้งหมด</option>
                    <option value="5">⭐⭐⭐⭐⭐ (5 ดาว)</option>
                    <option value="4">⭐⭐⭐⭐ (4 ดาว)</option>
                    <option value="3">⭐⭐⭐ (3 ดาว)</option>
                    <option value="2">⭐⭐ (2 ดาว)</option>
                    <option value="1">⭐ (1 ดาว)</option>
                    <option value="UNRATED">ยังไม่ได้ให้คะแนน</option>
                </select>

                <select id="sortSelect" onchange="applyFilters()">
                    <option value="DATE_DESC">ดูล่าสุดก่อน</option>
                    <option value="RATING_DESC">คะแนนสูงสุดก่อน</option>
                    <option value="RATING_ASC">คะแนนน้อยสุดก่อน</option>
                    <option value="TITLE_ASC">ชื่อหนัง (A-Z)</option>
                    <option value="RELEASE_DESC">ปีที่ฉาย (ใหม่-เก่า)</option>
                </select>

                <div class="view-btn-group">
                    <button class="view-btn active" id="btnGridView" onclick="switchView('GRID')"><i class="fa-solid fa-border-all"></i></button>
                    <button class="view-btn" id="btnTableView" onclick="switchView('TABLE')"><i class="fa-solid fa-list"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Movie Display Container -->
    <div id="moviesGrid" class="movies-grid"></div>
    
    <div id="tableWrapper" class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>ชื่อเรื่อง (Name)</th>
                    <th>ปีที่ฉาย</th>
                    <th>วันที่ดู</th>
                    <th>เรตติ้ง</th>
                </tr>
            </thead>
            <tbody id="movieTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // Google Sheets Link IDs
    const SHEET_IDS = {
        '2026': '1ZdV8YXXQAqXegMwJl3PpqHItTI6GXyx8RU2ZQmhF7Tg', 
        '2025': '1dNxvYfZUN-XBryNf_QB9DnaBM5Fc8TRg4k9Niv1y1hA',
        '2024': '10uRvpV3fI4tcGmCoTS4cSpCd32wGIEIuR6RpFRh3h68',
        '2023': '1TjOzc2WY9VOu-PujXk7QJj-G57Y1hcvPof7i6imsHy0',
        '2022': '1CTjHtjL3D0P5wn8vq8VX10gvy3xGaLog_Kv-z7kC9Bw',
        '2021': '1OZBdY4QRWriPuybGGxD4Wk2LomVcuuYCYICaK_b7oKo'
    };

    let allMoviesData = {};
    let activeYear = 'ALL';
    let activeView = 'GRID';

    // CSV Parser Logic
    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        const result = [];
        for (let line of lines) {
            if (!line.trim()) continue;
            let row = [];
            let insideQuotes = false;
            let entry = '';
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    if (insideQuotes && line[i+1] === '"') {
                        entry += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    row.push(entry.trim());
                    entry = '';
                } else {
                    entry += char;
                }
            }
            row.push(entry.trim());
            result.push(row);
        }
        return result;
    }

    // Dynamic Header & Column Extraction with Smart Star Parser
    function extractMoviesFromCSV(csvRows, year) {
        let headerIdx = -1;
        let colMap = { title: 2, releaseYear: 3, dateWatched: 4, rating: 5 };

        for (let i = 0; i < Math.min(csvRows.length, 6); i++) {
            const row = csvRows[i];
            if (!row) continue;
            for (let j = 0; j < row.length; j++) {
                const cell = row[j].toLowerCase();
                if (cell.includes('name') || cell.includes('ชื่อเรื่อง') || cell.includes('หนังที่ฉันดู') || cell.includes('title')) {
                    headerIdx = i;
                    colMap.title = j;
                }
                if (cell.includes('release') || (cell.includes('ปี') && !cell.includes('ดู'))) {
                    colMap.releaseYear = j;
                }
                if (cell.includes('date') || cell.includes('วันที่') || cell.includes('ดู')) {
                    colMap.dateWatched = j;
                }
                if (cell.includes('rating') || cell.includes('score') || cell.includes('เรตติ้ง') || cell.includes('คะแนน') || cell.includes('⭐')) {
                    colMap.rating = j;
                }
            }
            if (headerIdx !== -1) break;
        }

        const startRow = headerIdx !== -1 ? headerIdx + 1 : 3;
        const movies = [];

        for (let i = startRow; i < csvRows.length; i++) {
            const row = csvRows[i];
            if (!row || row.length <= Math.max(...Object.values(colMap))) continue;
            
            const title = row[colMap.title] ? row[colMap.title].replace(/^"|"$/g, '').trim() : '';
            if (!title || title.toLowerCase() === 'name' || title === 'หนังที่ฉันดู' || title === 'ชื่อเรื่อง') continue;

            const relYear = row[colMap.releaseYear] ? row[colMap.releaseYear].replace(/^"|"$/g, '').trim() : year;
            const dateWatched = row[colMap.dateWatched] ? row[colMap.dateWatched].replace(/^"|"$/g, '').trim() : '-';
            const rawRating = row[colMap.rating] ? row[colMap.rating].replace(/^"|"$/g, '').trim() : '';

            let rating = null;
            if (rawRating) {
                // เนื่องจาก Google Sheets ส่งดาวสีส้มและดาวสีเทามาเป็นตัวอักษร ⭐ ทั้งหมด (ทำให้ความยาวเท่ากับ 5 เสมอ เช่น ⭐⭐⭐○○)
                // เราจะใช้ความยาวของข้อความดาว หรือเช็คอักขระดาวจริง โดยใน Google Sheets ดาวสีเทามักจะถูกต่อท้าย
                // หรือวิธีที่แม่นยำที่สุด: นับจำนวนดาวที่แสดงผลจริงโดยตัดส่วนที่จางออก (หรือถ้าความยาวเป็น 5 และมีดาวผสม ให้เทียบความแตกต่าง)
                // สังเกตว่าถ้าให้ 3 ดาว ข้อความมักจะมีความยาวตัวอักษรดาว 3 ดวง (หรือถ้ามีดาวเทียม/ดาวเทาต่อท้าย ให้ตัดออกโดยนับเฉพาะตัวอักษรที่ซ้ำกันไม่เกิน 5 หรือเช็ค index)
                
                // ลองแยกนับเฉพาะดาวกลุ่มแรกสุดที่ติดกัน (เช่น ⭐⭐⭐)
                const starsOnly = rawRating.match(/[⭐★☆✰]/g);
                if (starsOnly) {
                    // หากดาวสีส้มและสีเทาเป็นตัวอักษรเดียวกัน ให้ดูว่ามีกี่ดวง ถ้าความยาวรวมเป็น 5 แต่มีดาวบางดวงที่เป็นดาวว่าง 
                    // ปกติใน Google Sheets ถ้าใช้ formula สร้างดาว จะคืนค่าเป็นตัวอักษรดาวตามจำนวนที่ให้คะแนนจริง (เช่นให้ 3 ดาว จะมีดาวแค่ 3 ตัว ไม่ใช่ 5 ตัว)
                    // แต่ถ้าใน Sheet คอลัมน์ F มีดาว 5 ดวงเสมอ (3 ส้ม + 2 เทา) ตัว CSV จะมองเห็นเป็น 5 ดวง
                    // แก้ไขโดย: ถ้ายาว 5 แต่มีดาวสีส้มผสมเทา ให้เช็คว่าตัวอักษรดาวตัวไหนต่างกัน หรือถ้าเหมือนกัน ให้ใช้ความยาวหารครึ่ง/นับเฉพาะกลุ่มแรก
                    // ลองตัดเฉพาะส่วนที่เป็นดาวทึบกลุ่มแรก:
                    let starStr = rawRating.replace(/["']/g, '');
                    // ถ้าใน Sheets พิมพ์ดาว 3 ดวง ก็จะได้ความยาว 3 พอดี แต่ถ้า Sheets ใส่สูตรเต็ม 5 ดวง จะยาว 5
                    // ให้ตรวจสอบว่าถ้ายาว 5 หรือมากกว่า ให้เช็คว่ามีตัวอักษรซ้ำ หรือถ้าเป็น 3 ดาว ให้เอา 3
                    // วิธีตัดที่แม่นยำสำหรับเคสนี้: นับจำนวนดาวก่อนที่จะเจอช่องว่างหรือตัวอักษรอื่น
                    let count = 0;
                    for (let char of starStr) {
                        if (char === '⭐' || char === '★' || char === '⭐️') {
                            count++;
                        } else {
                            break;
                        }
                    }
                    if (count > 0 && count <= 5) {
                        rating = count;
                    } else if (starStr.length > 0) {
                        // เผื่อกรณีพิมพ์ตัวเลขตรงๆ
                        const num = parseInt(starStr, 10);
                        if (!isNaN(num)) rating = num;
                    }
                }
            }

            movies.push({
                t: title,
                y: relYear || year,
                d: dateWatched,
                r: rating !== null ? Math.min(Math.max(rating, 1), 5) : null,
                yearWatched: year
            });
        }
        return movies;
    }

    // ดึงข้อมูลสดจาก Google Sheets
    async function fetchLiveData() {
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        statusText.innerText = 'กำลังดึงข้อมูลจาก Google Sheets...';
        
        let successCount = 0;
        const totalSheets = Object.keys(SHEET_IDS).length;
        const fetchedData = {};

        for (const [yr, sid] of Object.entries(SHEET_IDS)) {
            if (sid === 'ใส่_ID_ของปี_2026_ตรงนี้') continue; 
            
            const url = `https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:csv`;
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const csvText = await res.text();
                    const rows = parseCSV(csvText);
                    fetchedData[yr] = extractMoviesFromCSV(rows, yr);
                    successCount++;
                }
            } catch (err) {
                console.warn(`Fetch error for year ${yr}:`, err);
            }
        }

        allMoviesData = fetchedData;
        const targetCount = Object.values(SHEET_IDS).filter(id => id !== 'ใส่_ID_ของปี_2026_ตรงนี้').length;
        
        if (successCount > 0) {
            statusText.innerText = `เชื่อมต่อ Google Sheets สำเร็จ (${successCount}/${targetCount} ปี)`;
            statusBadge.style.backgroundColor = '#064e3b';
            statusBadge.style.color = '#34d399';
        } else {
            statusText.innerText = 'ไม่สามารถดึงข้อมูลได้';
            statusBadge.style.backgroundColor = '#7f1d1d';
            statusBadge.style.color = '#f87171';
        }

        updateStats();
        applyFilters();
    }

    function selectYear(yr) {
        activeYear = yr;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === (yr === 'ALL' ? 'ทั้งหมด' : yr));
        });
        applyFilters();
    }

    function switchView(view) {
        activeView = view;
        document.getElementById('btnGridView').classList.toggle('active', view === 'GRID');
        document.getElementById('btnTableView').classList.toggle('active', view === 'TABLE');
        
        document.getElementById('moviesGrid').style.display = view === 'GRID' ? 'grid' : 'none';
        document.getElementById('tableWrapper').style.display = view === 'TABLE' ? 'block' : 'none';
    }

    function updateStats() {
        let allList = [];
        const yearCounts = {};

        for (const [yr, list] of Object.entries(allMoviesData)) {
            if (activeYear === 'ALL' || activeYear === yr) {
                allList = allList.concat(list);
            }
            if (list.length > 0) {
                yearCounts[yr] = list.length;
            }
        }

        document.getElementById('statTotal').innerText = allList.length;

        const ratedMovies = allList.filter(m => m.r !== null);
        if (ratedMovies.length > 0) {
            const avg = (ratedMovies.reduce((acc, m) => acc + m.r, 0) / ratedMovies.length).toFixed(1);
            document.getElementById('statAvgRating').innerText = avg;

            const fiveStars = ratedMovies.filter(m => m.r === 5).length;
            document.getElementById('statFiveStar').innerText = fiveStars;
        } else {
            document.getElementById('statAvgRating').innerText = '-';
            document.getElementById('statFiveStar').innerText = '0';
        }

        let maxYr = '-';
        let maxCount = 0;
        for (const [yr, count] of Object.entries(yearCounts)) {
            if (count > maxCount) {
                maxCount = count;
                maxYr = `${yr} (${count} เรื่อง)`;
            }
        }
        document.getElementById('statTopYear').innerText = maxYr;
    }

    function applyFilters() {
        let movies = [];
        for (const [yr, list] of Object.entries(allMoviesData)) {
            if (activeYear === 'ALL' || activeYear === yr) {
                movies = movies.concat(list);
            }
        }

        const search = document.getElementById('searchInput').value.toLowerCase();
        const rating = document.getElementById('ratingFilter').value;
        const sort = document.getElementById('sortSelect').value;

        if (search) {
            movies = movies.filter(m => m.t.toLowerCase().includes(search));
        }

        if (rating !== 'ALL') {
            if (rating === 'UNRATED') {
                movies = movies.filter(m => m.r === null);
            } else {
                movies = movies.filter(m => m.r === parseInt(rating, 10));
            }
        }

        // Sorting
        movies.sort((a, b) => {
            if (sort === 'RATING_DESC') return (b.r || 0) - (a.r || 0);
            if (sort === 'RATING_ASC') return (a.r || 0) - (b.r || 0);
            if (sort === 'TITLE_ASC') return a.t.localeCompare(b.t);
            if (sort === 'RELEASE_DESC') return (b.y || 0) - (a.y || 0);
            return 0; // Default DATE_DESC
        });

        renderMovies(movies);
    }

    function renderMovies(movies) {
        const grid = document.getElementById('moviesGrid');
        const tbody = document.getElementById('movieTableBody');
        grid.innerHTML = '';
        tbody.innerHTML = '';

        if (movies.length === 0) {
            const emptyHTML = '<div class="empty-state"><i class="fa-solid fa-film-slash fa-2x"></i><p style="margin-top:10px;">ไม่พบรายการภาพยนตร์</p></div>';
            grid.innerHTML = emptyHTML;
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">${emptyHTML}</td></tr>`;
            return;
        }

        movies.forEach((m, idx) => {
            const starsHTML = m.r !== null ? '⭐'.repeat(m.r) : '<span style="color: var(--text-muted);">-</span>';
            
            // Grid Card
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <div>
                    <div class="movie-header">
                        <div class="movie-title">${m.t}</div>
                        <span class="release-year">${m.y}</span>
                    </div>
                </div>
                <div class="movie-meta">
                    <span><i class="fa-regular fa-calendar"></i> ${m.d} (${m.yearWatched})</span>
                    <span class="stars">${starsHTML}</span>
                </div>
            `;
            grid.appendChild(card);

            // Table Row
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${idx + 1}</td>
                <td style="font-weight:600; color:#fff;">${m.t}</td>
                <td>${m.y}</td>
                <td>${m.d} (${m.yearWatched})</td>
                <td><span class="stars">${starsHTML}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = () => {
        fetchLiveData();
    };
</script>
</body>
</html>
