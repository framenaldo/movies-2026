<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies I've Watched Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b1121;
            --card-bg: rgba(30, 41, 59, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-gradient: linear-gradient(135deg, #3b82f6, #6366f1);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --success-gradient: linear-gradient(135deg, #10b981, #059669);
            --star-color: #f5c518;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Noto Sans Thai', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(99, 102, 241, 0.08), transparent 25%);
            color: var(--text-main);
            padding: 30px 20px;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ---------------- Header ---------------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 25px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-title h1 {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-title h1 i {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
        }

        .sync-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status-badge {
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 30px;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.05);
        }

        .btn-action {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-add-toggle { background: var(--success-gradient); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); }
        .btn-add-toggle:hover { box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }

        /* ---------------- Add Movie Form ---------------- */
        .add-form-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            display: none;
            animation: slideDown 0.3s ease-out forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .add-form-panel.show { display: block; }
        .add-form-panel h3 { margin-bottom: 20px; font-size: 1.25rem; color: #ffffff; display: flex; align-items: center; gap: 8px; }
        .add-form-panel h3 i { color: #10b981; }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
        .form-group input, .form-group select {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background-color: rgba(15, 23, 42, 1);
        }

        /* ---------------- Stats Grid ---------------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 18px;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .stat-icon {
            width: 54px; height: 54px;
            border-radius: 14px;
            background: var(--accent-gradient);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .stat-icon.alt-1 { background: linear-gradient(135deg, #f59e0b, #ea580c); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .stat-icon.alt-2 { background: linear-gradient(135deg, #ec4899, #e11d48); box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); }

        .stat-info h3 { font-size: 1.8rem; font-weight: 700; line-height: 1.2; }
        .stat-info p { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

        /* ---------------- Controls & Filters ---------------- */
        .controls-panel {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            margin-bottom: 30px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .year-tabs {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
        }
        .year-tabs::-webkit-scrollbar { height: 4px; }
        .year-tabs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .tab-btn {
            background-color: rgba(15, 23, 42, 0.8);
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .tab-btn:hover { color: white; background-color: rgba(255,255,255,0.05); }
        .tab-btn.active { background: var(--accent-gradient); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }

        .filter-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .search-box { position: relative; flex: 1; min-width: 260px; }
        .search-box input {
            width: 100%; padding: 12px 15px 12px 42px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1); background-color: rgba(15, 23, 42, 0.6);
            color: var(--text-main); outline: none; transition: all 0.3s;
        }
        .search-box input:focus { border-color: var(--accent-color); background-color: rgba(15, 23, 42, 1); }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .filter-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .filter-group select {
            padding: 10px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            background-color: rgba(15, 23, 42, 0.6); color: var(--text-main); outline: none; cursor: pointer; font-weight: 500;
        }

        .view-btn-group {
            display: flex; background-color: rgba(15, 23, 42, 0.6); border-radius: 10px; padding: 4px; border: 1px solid rgba(255,255,255,0.1);
        }
        .view-btn { background: none; border: none; color: var(--text-muted); padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .view-btn.active { background-color: var(--accent-color); color: white; }

        /* ---------------- Movie Grid & Cards ---------------- */
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }

        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .movie-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 15px rgba(99,102,241,0.2);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            background: #0f172a;
            overflow: hidden;
        }

        .poster-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
            padding: 15px;
        }

        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transition: transform 0.5s;
        }

        .movie-card:hover .poster-img { transform: scale(1.05); }

        .rating-badge {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 700; font-size: 0.8rem;
            display: none; align-items: center; gap: 5px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }
        .rating-badge i { color: var(--star-color); }

        .movie-info {
            padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between;
        }

        .movie-title {
            font-size: 1rem; font-weight: 600; margin-bottom: 10px; line-height: 1.3;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* สไตล์ไอคอนลิงก์ */
        .imdb-link-icon {
            font-size: 0.75rem;
            color: var(--accent-color);
            margin-left: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .movie-card:hover .imdb-link-icon { opacity: 1; }

        .movie-meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.8rem; color: var(--text-muted);
        }

        .release-year {
            background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; font-weight: 600; color: #cbd5e1;
        }

        .custom-badge {
            font-size: 0.7rem; background: var(--success-gradient); color: #fff; padding: 2px 6px; border-radius: 10px; margin-left: 5px; font-weight: 500;
        }

        /* ---------------- Table View ---------------- */
        .table-wrapper { width: 100%; overflow-x: auto; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--card-border); display: none; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(15, 23, 42, 0.6); color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        tr:hover { background: rgba(255,255,255,0.03); cursor: pointer; }
        td.table-title { font-weight: 600; color: #fff; }
        .table-imdb-link { display: none; margin-left: 8px; color: var(--accent-color); }
        tr:hover .table-imdb-link { display: inline-block; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1 / -1; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-title">
            <h1><i class="fa-solid fa-ticket"></i> Movies Watched Tracker</h1>
        </div>
        <div class="sync-box">
            <div id="statusBadge" class="status-badge">
                <i class="fa-solid fa-spinner fa-spin"></i> <span id="statusText">กำลังโหลดข้อมูล...</span>
            </div>
            <button class="btn-action btn-add-toggle" onclick="toggleAddForm()">
                <i class="fa-solid fa-plus"></i> เพิ่มหนังใหม่
            </button>
            <button class="btn-action" onclick="fetchLiveData()">
                <i class="fa-solid fa-rotate-right"></i> Sync ข้อมูล
            </button>
        </div>
    </header>

    <div id="addFormPanel" class="add-form-panel">
        <h3><i class="fa-solid fa-circle-plus"></i> เพิ่มรายการภาพยนตร์ใหม่</h3>
        <form id="addMovieForm" class="form-grid" onsubmit="addNewMovie(event)">
            <div class="form-group"><label>ชื่อภาพยนตร์</label><input type="text" id="inputTitle" required autocomplete="off"></div>
            <div class="form-group"><label>ปีที่ฉาย</label><input type="text" id="inputReleaseYear" required autocomplete="off"></div>
            <div class="form-group"><label>วันที่ดู</label><input type="text" id="inputDateWatched" required autocomplete="off"></div>
            <div class="form-group">
                <label>บันทึกลงปี (แท็บ)</label>
                <select id="inputTargetYear">
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                </select>
            </div>
            <button type="submit" class="btn-action" style="height: 46px; justify-content: center;">บันทึก</button>
        </form>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-film"></i></div>
            <div class="stat-info"><h3 id="statTotal">0</h3><p>จำนวนหนังทั้งหมด</p></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon alt-1"><i class="fa-solid fa-calendar-check"></i></div>
            <div class="stat-info"><h3 id="statActiveTabCount">0</h3><p>จำนวนในแท็บที่เลือก</p></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon alt-2"><i class="fa-solid fa-fire"></i></div>
            <div class="stat-info"><h3 id="statTopYear">-</h3><p>ปีที่ดูหนังมากที่สุด</p></div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="year-tabs" id="yearTabs">
            <button class="tab-btn active" onclick="selectYear('ALL')">ทั้งหมด</button>
            <button class="tab-btn" onclick="selectYear('2026')">2026</button>
            <button class="tab-btn" onclick="selectYear('2025')">2025</button>
            <button class="tab-btn" onclick="selectYear('2024')">2024</button>
            <button class="tab-btn" onclick="selectYear('2023')">2023</button>
            <button class="tab-btn" onclick="selectYear('2022')">2022</button>
            <button class="tab-btn" onclick="selectYear('2021')">2021</button>
        </div>

        <div class="filter-row">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อหนัง..." oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <select id="sortSelect" onchange="applyFilters()">
                    <option value="DATE_DESC">เรียงตามลำดับในไฟล์</option>
                    <option value="TITLE_ASC">เรียงตามชื่อหนัง (A-Z)</option>
                    <option value="RELEASE_DESC">เรียงตามปีที่ฉาย (ใหม่-เก่า)</option>
                </select>
                <div class="view-btn-group">
                    <button class="view-btn active" id="btnGridView" onclick="switchView('GRID')"><i class="fa-solid fa-border-all"></i></button>
                    <button class="view-btn" id="btnTableView" onclick="switchView('TABLE')"><i class="fa-solid fa-list"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="moviesGrid" class="movies-grid"></div>
    
    <div id="tableWrapper" class="table-wrapper">
        <table>
            <thead>
                <tr><th style="width: 60px;">#</th><th>ชื่อเรื่อง (Title)</th><th>ปีที่ฉาย</th><th>วันที่ดู</th></tr>
            </thead>
            <tbody id="movieTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 🔑 API Keys
    const TMDB_API = '7b0e42848add2ef42a3614c6a40b801b';
    const OMDB_API = '941b28f2';

    const SHEET_IDS = {
        '2026': '1ZdV8YXXQAqXegMwJl3PpqHItTI6GXyx8RU2ZQmhF7Tg', 
        '2025': '1dNxvYfZUN-XBryNf_QB9DnaBM5Fc8TRg4k9Niv1y1hA',
        '2024': '10uRvpV3fI4tcGmCoTS4cSpCd32wGIEIuR6RpFRh3h68',
        '2023': '1TjOzc2WY9VOu-PujXk7QJj-G57Y1hcvPof7i6imsHy0',
        '2022': '1CTjHtjL3D0P5wn8vq8VX10gvy3xGaLog_Kv-z7kC9Bw',
        '2021': '1OZBdY4QRWriPuybGGxD4Wk2LomVcuuYCYICaK_b7oKo'
    };

    let allMoviesData = {};
    let activeYear = 'ALL';
    let activeView = 'GRID';
    let observer = null;

    // --- ฟังก์ชันเปิดลิงก์ไปยัง IMDb ---
    function openIMDB(imdbID, title) {
        if (imdbID && imdbID !== 'N/A') {
            window.open(`https://www.imdb.com/title/${imdbID}/`, '_blank');
        } else {
            // ถ้าไม่เจอ ID จะใช้การค้นหาชื่อหนังใน IMDb แทน
            window.open(`https://www.imdb.com/find?q=${encodeURIComponent(title)}`, '_blank');
        }
    }

    // --- API Fetching Logic with Caching ---
    async function fetchPosterAndRating(title, year) {
        const cacheKey = `meta_v2_${title.toLowerCase()}_${year}`; // เปลี่ยน cache key เพื่อให้ดึงข้อมูลใหม่ (เอา imdbID มาด้วย)
        if (localStorage.getItem(cacheKey)) {
            return JSON.parse(localStorage.getItem(cacheKey));
        }

        let meta = { poster: null, rating: null, source: null, imdbID: null };

        try {
            // 1. ลองหาจาก OMDb ก่อน เพื่อเอา imdbID และภาพถ้ามี
            let omdbUrl = `https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${OMDB_API}`;
            // ส่งปีไปถ้ามี เพื่อให้การค้นหาแม่นยำขึ้น
            if (year && !isNaN(parseInt(year))) {
                // บางครั้งปีในชีตอาจต่างกับปีจริง 1 ปี เลยลองดึงแบบไม่จำกัดปีก่อนถ้าหาไม่เจอ
                omdbUrl += `&y=${year}`;
            }
            
            let omdbRes = await fetch(omdbUrl);
            let omdbData = await omdbRes.json();
            
            if (omdbData.Response === "True") {
                if (omdbData.Poster !== "N/A") meta.poster = omdbData.Poster;
                if (omdbData.imdbRating !== "N/A") {
                    meta.rating = omdbData.imdbRating;
                    meta.source = 'IMDb';
                }
                meta.imdbID = omdbData.imdbID;
            } else {
                // ถ้าค้นหาแบบระบุปีไม่เจอ ลองค้นหาเฉพาะชื่ออีกครั้ง
                let omdbUrlFallback = `https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${OMDB_API}`;
                let omdbResFallback = await fetch(omdbUrlFallback);
                let omdbDataFallback = await omdbResFallback.json();
                if (omdbDataFallback.Response === "True") {
                    if (omdbDataFallback.Poster !== "N/A") meta.poster = omdbDataFallback.Poster;
                    if (omdbDataFallback.imdbRating !== "N/A") {
                        meta.rating = omdbDataFallback.imdbRating;
                        meta.source = 'IMDb';
                    }
                    meta.imdbID = omdbDataFallback.imdbID;
                }
            }

            // 2. ถ้ายังไม่ได้โปสเตอร์ หรืออยากได้ภาพที่สวยกว่าจาก TMDB (TMDB รูปมักจะชัดกว่า)
            let tmdbUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API}&query=${encodeURIComponent(title)}&language=th-TH`;
            let res = await fetch(tmdbUrl);
            let data = await res.json();
            
            if (data.results && data.results.length > 0) {
                let match = data.results[0];
                if (year && year !== '-' && !isNaN(parseInt(year))) {
                    const exactMatch = data.results.find(m => m.release_date && m.release_date.startsWith(year));
                    if (exactMatch) match = exactMatch;
                }
                
                // ใช้โปสเตอร์จาก TMDB เพราะมีความละเอียดสูงกว่า
                if (match.poster_path) {
                    meta.poster = `https://image.tmdb.org/t/p/w500${match.poster_path}`;
                }

                // ถ้ายังไม่มี Rating จาก OMDb ให้ใช้ของ TMDB
                if (!meta.rating && match.vote_average > 0) {
                    meta.rating = match.vote_average.toFixed(1);
                    meta.source = 'TMDB';
                }
            }
        } catch (e) { console.error("API Fetch Error:", e); }

        localStorage.setItem(cacheKey, JSON.stringify(meta));
        return meta;
    }

    function toggleAddForm() { document.getElementById('addFormPanel').classList.toggle('show'); }

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        const result = [];
        for (let line of lines) {
            if (!line.trim()) continue;
            let row = [], insideQuotes = false, entry = '';
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    if (insideQuotes && line[i+1] === '"') { entry += '"'; i++; } 
                    else { insideQuotes = !insideQuotes; }
                } else if (char === ',' && !insideQuotes) {
                    row.push(entry.trim()); entry = '';
                } else { entry += char; }
            }
            row.push(entry.trim());
            result.push(row);
        }
        return result;
    }

    function extractMoviesFromCSV(csvRows, year) {
        let headerIdx = -1;
        let colMap = { title: 2, releaseYear: 3, dateWatched: 4 };

        for (let i = 0; i < Math.min(csvRows.length, 6); i++) {
            const row = csvRows[i];
            if (!row) continue;
            for (let j = 0; j < row.length; j++) {
                const cell = row[j].toLowerCase();
                if (cell.includes('name') || cell.includes('ชื่อเรื่อง') || cell.includes('title')) { headerIdx = i; colMap.title = j; }
                if (cell.includes('release') || (cell.includes('ปี') && !cell.includes('ดู'))) { colMap.releaseYear = j; }
                if (cell.includes('date') || cell.includes('วันที่') || cell.includes('ดู')) { colMap.dateWatched = j; }
            }
            if (headerIdx !== -1) break;
        }

        const startRow = headerIdx !== -1 ? headerIdx + 1 : 3;
        const movies = [];

        for (let i = startRow; i < csvRows.length; i++) {
            const row = csvRows[i];
            if (!row || row.length <= Math.max(...Object.values(colMap))) continue;
            
            const title = row[colMap.title] ? row[colMap.title].replace(/^"|"$/g, '').trim() : '';
            if (!title || title.toLowerCase() === 'name' || title === 'หนังที่ฉันดู' || title === 'ชื่อเรื่อง') continue;

            const relYear = row[colMap.releaseYear] ? row[colMap.releaseYear].replace(/^"|"$/g, '').trim() : year;
            const dateWatched = row[colMap.dateWatched] ? row[colMap.dateWatched].replace(/^"|"$/g, '').trim() : '-';

            movies.push({ t: title, y: relYear || year, d: dateWatched, yearWatched: year, isCustom: false });
        }
        return movies;
    }

    async function fetchLiveData() {
        const statusBadge = document.getElementById('statusBadge');
        statusBadge.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span id="statusText">กำลังโหลด...</span>';
        
        let savedCustomData = JSON.parse(localStorage.getItem('custom_movies_data')) || {};
        let successCount = 0;
        const fetchedData = {};

        for (const [yr, sid] of Object.entries(SHEET_IDS)) {
            const url = `https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:csv`;
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const csvText = await res.text();
                    let sheetMovies = extractMoviesFromCSV(parseCSV(csvText), yr);
                    if (savedCustomData[yr]) sheetMovies = savedCustomData[yr].concat(sheetMovies);
                    fetchedData[yr] = sheetMovies;
                    successCount++;
                }
            } catch (err) {
                if (savedCustomData[yr]) fetchedData[yr] = savedCustomData[yr];
            }
        }

        allMoviesData = fetchedData;
        
        if (successCount > 0) {
            statusBadge.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>เชื่อมต่อสำเร็จ (${successCount}/6)</span>`;
            statusBadge.style.background = 'rgba(16, 185, 129, 0.1)';
            statusBadge.style.color = '#34d399';
            statusBadge.style.borderColor = 'rgba(16, 185, 129, 0.2)';
        } else {
            statusBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> <span>ออฟไลน์โหมด</span>';
            statusBadge.style.background = 'rgba(239, 68, 68, 0.1)';
            statusBadge.style.color = '#f87171';
            statusBadge.style.borderColor = 'rgba(239, 68, 68, 0.2)';
        }

        updateStats();
        applyFilters();
    }

    function addNewMovie(event) {
        event.preventDefault();
        const title = document.getElementById('inputTitle').value.trim();
        const releaseYear = document.getElementById('inputReleaseYear').value.trim();
        const dateWatched = document.getElementById('inputDateWatched').value.trim();
        const targetYear = document.getElementById('inputTargetYear').value;

        const newMovie = { t: title, y: releaseYear, d: dateWatched, yearWatched: targetYear, isCustom: true };
        if (!allMoviesData[targetYear]) allMoviesData[targetYear] = [];
        allMoviesData[targetYear].unshift(newMovie);

        let savedCustomData = JSON.parse(localStorage.getItem('custom_movies_data')) || {};
        if (!savedCustomData[targetYear]) savedCustomData[targetYear] = [];
        savedCustomData[targetYear].unshift(newMovie);
        localStorage.setItem('custom_movies_data', JSON.stringify(savedCustomData));

        document.getElementById('addMovieForm').reset();
        toggleAddForm();
        selectYear(targetYear);
        updateStats();
        applyFilters();
    }

    function selectYear(yr) {
        activeYear = yr;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === (yr === 'ALL' ? 'ทั้งหมด' : yr));
        });
        applyFilters();
    }

    function switchView(view) {
        activeView = view;
        document.getElementById('btnGridView').classList.toggle('active', view === 'GRID');
        document.getElementById('btnTableView').classList.toggle('active', view === 'TABLE');
        document.getElementById('moviesGrid').style.display = view === 'GRID' ? 'grid' : 'none';
        document.getElementById('tableWrapper').style.display = view === 'TABLE' ? 'block' : 'none';
    }

    function updateStats() {
        let allList = [], activeList = [];
        const yearCounts = {};
        for (const [yr, list] of Object.entries(allMoviesData)) {
            allList = allList.concat(list);
            if (activeYear === 'ALL' || activeYear === yr) activeList = activeList.concat(list);
            if (list.length > 0) yearCounts[yr] = list.length;
        }
        document.getElementById('statTotal').innerText = allList.length;
        document.getElementById('statActiveTabCount').innerText = activeList.length;

        let maxYr = '-', maxCount = 0;
        for (const [yr, count] of Object.entries(yearCounts)) {
            if (count > maxCount) { maxCount = count; maxYr = `${yr} (${count})`; }
        }
        document.getElementById('statTopYear').innerText = maxYr;
    }

    function applyFilters() {
        let movies = [];
        for (const [yr, list] of Object.entries(allMoviesData)) {
            if (activeYear === 'ALL' || activeYear === yr) movies = movies.concat(list);
        }

        const search = document.getElementById('searchInput').value.toLowerCase();
        const sort = document.getElementById('sortSelect').value;

        if (search) movies = movies.filter(m => m.t.toLowerCase().includes(search));

        movies.sort((a, b) => {
            if (sort === 'TITLE_ASC') return a.t.localeCompare(b.t);
            if (sort === 'RELEASE_DESC') return (b.y || 0) - (a.y || 0);
            return 0; // Default DATE_DESC
        });

        renderMovies(movies);
    }

    function renderMovies(movies) {
        const grid = document.getElementById('moviesGrid');
        const tbody = document.getElementById('movieTableBody');
        grid.innerHTML = ''; tbody.innerHTML = '';

        if (movies.length === 0) {
            grid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-ghost fa-3x" style="opacity:0.3; margin-bottom:15px;"></i><p>ไม่พบรายการภาพยนตร์</p></div>`;
            return;
        }

        // Setup Lazy Loading Observer
        if(observer) observer.disconnect();
        observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const title = card.dataset.title;
                    const year = card.dataset.year;
                    
                    fetchPosterAndRating(title, year).then(meta => {
                        // ซ่อน Event Listener คลิกที่การ์ดเพื่อเปิด IMDb
                        card.onclick = () => openIMDB(meta.imdbID, title);

                        if (meta.poster) {
                            const img = card.querySelector('.poster-img');
                            img.src = meta.poster;
                            img.onload = () => {
                                img.style.display = 'block';
                                card.querySelector('.poster-placeholder').style.display = 'none';
                            };
                        }
                        if (meta.rating) {
                            const badge = card.querySelector('.rating-badge');
                            badge.querySelector('.rating-val').innerText = meta.rating;
                            badge.style.display = 'flex';
                            if (meta.source === 'IMDb') {
                                badge.style.background = 'rgba(245, 197, 24, 0.9)';
                                badge.style.color = '#000';
                            }
                        }
                    });
                    obs.unobserve(card);
                }
            });
        }, { rootMargin: '100px' });

        movies.forEach((m, idx) => {
            const customTag = m.isCustom ? `<span class="custom-badge"><i class="fa-solid fa-pen-nib"></i> เพิ่มเอง</span>` : '';
            
            // Grid Card
            const card = document.createElement('div');
            card.className = 'movie-card fade-in';
            card.style.animationDelay = `${Math.min(idx * 0.03, 0.5)}s`;
            card.dataset.title = m.t;
            card.dataset.year = m.y;
            card.innerHTML = `
                <div class="poster-wrapper">
                    <div class="poster-placeholder">
                        <i class="fa-solid fa-film fa-2x"></i>
                        <span style="font-size: 0.75rem; margin-top: 10px; opacity: 0.5; padding: 0 10px;">${m.t}</span>
                    </div>
                    <img class="poster-img" alt="${m.t}" loading="lazy">
                    <div class="rating-badge"><i class="fa-solid fa-star"></i> <span class="rating-val"></span></div>
                </div>
                <div class="movie-info">
                    <h3 class="movie-title">${m.t} <i class="fa-solid fa-arrow-up-right-from-square imdb-link-icon"></i> ${customTag}</h3>
                    <div class="movie-meta">
                        <span class="release-year">${m.y}</span>
                        <span><i class="fa-regular fa-calendar-check" style="color:var(--accent-color); margin-right:5px;"></i>${m.d}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
            observer.observe(card);

            // Table Row
            const tr = document.createElement('tr');
            tr.className = 'fade-in';
            tr.style.animationDelay = `${Math.min(idx * 0.02, 0.3)}s`;
            // เพิ่ม Onclick สำหรับ Table View ด้วย
            tr.onclick = () => {
                fetchPosterAndRating(m.t, m.y).then(meta => openIMDB(meta.imdbID, m.t));
            };
            tr.innerHTML = `
                <td style="color: var(--text-muted);">${idx + 1}</td>
                <td class="table-title">${m.t} <i class="fa-solid fa-arrow-up-right-from-square table-imdb-link"></i> ${customTag}</td>
                <td><span class="release-year" style="margin-left:0;">${m.y}</span></td>
                <td style="color: var(--text-muted);"><i class="fa-regular fa-calendar-check" style="color: var(--accent-color); margin-right: 6px;"></i> ${m.d} (${m.yearWatched})</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = () => { fetchLiveData(); };
</script>
