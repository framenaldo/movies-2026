<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies I've Watched Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Chart.js สำหรับวาดกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            /* Editorial Glass Theme (Apple Style) */
            --bg-color: #111111;
            --bg-gradient: radial-gradient(circle at top left, #222222, #111111);
            --glass-bg: rgba(25, 25, 25, 0.6); 
            --glass-border: rgba(255, 255, 255, 0.05);
            --accent-gradient: linear-gradient(135deg, #ffffff, #a3a3a3);
            --accent-color: #ffffff;
            --accent-hover: #d4d4d4;
            --success-color: #34c759;
            --star-color: #ffffff; 
            --text-main: #ffffff;
            --text-muted: #8e8e93; 
            --blur-amount: 16px;
            --border-radius: 14px; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Noto Sans Thai', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 40px 20px;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ---------------- Utilities ---------------- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        /* ---------------- Header ---------------- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 30px; margin-bottom: 35px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); flex-wrap: wrap; gap: 20px;
        }
        .logo-title h1 { font-size: 2.2rem; font-weight: 700; display: flex; align-items: center; gap: 12px; letter-spacing: -0.5px; }
        .logo-title h1 i { color: var(--accent-color); font-size: 2rem; }
        .sync-box { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .status-badge {
            font-size: 0.85rem; font-weight: 500; padding: 8px 16px; border-radius: 30px;
            background: rgba(52, 199, 89, 0.1); color: var(--success-color); display: flex; align-items: center; gap: 8px;
        }
        .btn-action {
            background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: 500; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px; transition: all 0.2s ease; backdrop-filter: blur(8px);
        }
        .btn-action:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.02); }
        .btn-add-toggle { background: var(--text-main); color: #000; border: none; }
        .btn-add-toggle:hover { background: var(--accent-hover); color: #000; }
        .btn-danger { background: rgba(255, 59, 48, 0.15); color: #ff453a; border: none; }
        .btn-danger:hover { background: rgba(255, 59, 48, 0.25); }

        /* ---------------- Add Movie Form ---------------- */
        .add-form-panel { padding: 30px; margin-bottom: 35px; display: none; animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        .add-form-panel.show { display: block; }
        .add-form-panel h3 { margin-bottom: 20px; font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 15px; align-items: end; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select {
            padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(0, 0, 0, 0.4); color: var(--text-main); outline: none; font-size: 0.95rem; transition: all 0.2s ease;
        }
        .form-group input:focus, .form-group select:focus { border-color: rgba(255, 255, 255, 0.4); background-color: rgba(0, 0, 0, 0.6); }

        /* ---------------- Stats Grid ---------------- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .stat-card { padding: 24px; display: flex; align-items: center; gap: 20px; transition: transform 0.3s ease; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-icon {
            width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.1);
            color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .stat-info h3 { font-size: 2rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.5px; }
        .stat-info p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

        /* ---------------- Charts Section ---------------- */
        .charts-container { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 35px; }
        .chart-box { padding: 25px; display: flex; flex-direction: column; gap: 15px; min-height: 320px; }
        .chart-box.full-width { grid-column: 1 / -1; }
        .chart-header { font-size: 1.1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .chart-header i { color: var(--text-muted); }
        .canvas-wrapper { position: relative; flex: 1; width: 100%; height: 100%; }
        @media (max-width: 900px) { .charts-container { grid-template-columns: 1fr; } }

        /* ---------------- Controls & Filters ---------------- */
        .controls-panel { padding: 20px 25px; margin-bottom: 35px; display: flex; flex-direction: column; gap: 20px; }
        .year-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .year-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: transparent; color: var(--text-muted); border: none; padding: 8px 16px;
            border-radius: 20px; cursor: pointer; font-weight: 500; font-size: 0.95rem; white-space: nowrap; transition: all 0.2s ease;
        }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { background: var(--text-main); color: #000; font-weight: 600; }

        .filter-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .search-box { position: relative; flex: 1; min-width: 260px; }
        .search-box input {
            width: 100%; padding: 12px 15px 12px 42px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(0, 0, 0, 0.3); color: var(--text-main); outline: none; transition: all 0.2s; font-size: 0.95rem;
        }
        .search-box input:focus { border-color: rgba(255, 255, 255, 0.2); background-color: rgba(0, 0, 0, 0.5); }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        
        .filter-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .filter-group select {
            padding: 10px 16px; border-radius: 12px; background: rgba(0, 0, 0, 0.3); color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.05); outline: none; cursor: pointer; font-weight: 500;
            font-size: 0.9rem; -webkit-appearance: none; appearance: none;
        }
        .view-btn-group { display: flex; background: rgba(0, 0, 0, 0.3); border-radius: 12px; padding: 4px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .view-btn { background: none; border: none; color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
        .view-btn.active { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }

        /* ---------------- Movie Grid (Posters) ---------------- */
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px; }
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .movie-card { display: flex; flex-direction: column; position: relative; cursor: pointer; }
        .poster-wrapper {
            position: relative; width: 100%; aspect-ratio: 2 / 3; background: rgba(255, 255, 255, 0.03);
            border-radius: var(--border-radius); overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .movie-card:hover .poster-wrapper { transform: scale(1.03); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5); border-color: rgba(255, 255, 255, 0.15); }
        
        .poster-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-align: center; padding: 20px; }
        .poster-img { width: 100%; height: 100%; object-fit: cover; display: none; transition: transform 0.5s ease; }
        .movie-card:hover .poster-img { transform: scale(1.05); }

        .rating-badge {
            position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            color: #fff; padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 0.8rem;
            display: none; align-items: center; gap: 4px; border: 1px solid rgba(255, 255, 255, 0.1); z-index: 10;
        }
        .rating-badge i { color: var(--star-color); font-size: 0.75rem; }

        .movie-info { padding: 16px 4px 0 4px; display: flex; flex-direction: column; gap: 4px; }
        .movie-title {
            font-size: 1.05rem; font-weight: 600; line-height: 1.3; color: var(--text-main);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -0.2px;
        }
        .imdb-link-icon { font-size: 0.7rem; color: var(--text-muted); margin-left: 4px; opacity: 0; transition: opacity 0.2s ease, color 0.2s ease; vertical-align: middle; }
        .movie-card:hover .imdb-link-icon { opacity: 1; color: var(--text-main); }
        
        .movie-meta { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--text-muted); font-weight: 400; }
        .release-year { font-weight: 500; }
        .custom-badge {
            font-size: 0.65rem; background: rgba(255, 255, 255, 0.1); color: var(--text-main);
            padding: 2px 8px; border-radius: 12px; margin-left: 6px; font-weight: 500; border: 1px solid rgba(255, 255, 255, 0.05); vertical-align: middle;
        }

        /* ---------------- Table View ---------------- */
        .table-wrapper { width: 100%; overflow-x: auto; display: none; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        tr { transition: background-color 0.2s ease; cursor: pointer; }
        tr:hover { background-color: rgba(255, 255, 255, 0.03); }
        td.table-title { font-weight: 500; color: var(--text-main); font-size: 1rem; }
        .table-imdb-link { display: none; margin-left: 8px; color: var(--text-muted); font-size: 0.8rem; }
        tr:hover .table-imdb-link { display: inline-block; }

        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 15px; grid-column: 1 / -1; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-title">
            <h1><i class="fa-solid fa-film"></i> Movies Tracker</h1>
        </div>
        <div class="sync-box">
            <span id="statusText" style="font-size: 0.85rem; color: var(--text-muted); margin-right: 10px;">เตรียมพร้อมโหลด...</span>
            <button class="btn-action btn-add-toggle" onclick="toggleAddForm()"><i class="fa-solid fa-plus"></i> เพิ่มหนัง</button>
            <button class="btn-action btn-danger" onclick="clearImageCache()"><i class="fa-solid fa-broom"></i> ล้างรูป</button>
            <button class="btn-action" onclick="fetchLiveData()"><i class="fa-solid fa-rotate-right"></i> ซิงค์</button>
        </div>
    </header>

    <div id="addFormPanel" class="add-form-panel glass-panel">
        <h3>เพิ่มรายการภาพยนตร์</h3>
        <form id="addMovieForm" class="form-grid" onsubmit="addNewMovie(event)">
            <div class="form-group"><label>ชื่อภาพยนตร์</label><input type="text" id="inputTitle" required autocomplete="off"></div>
            <div class="form-group"><label>ปีที่ฉาย</label><input type="text" id="inputReleaseYear" required autocomplete="off"></div>
            <div class="form-group"><label>วันที่ดู</label><input type="text" id="inputDateWatched" required autocomplete="off"></div>
            <div class="form-group">
                <label>บันทึกลงหมวดหมู่</label>
                <select id="inputTargetYear">
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                </select>
            </div>
            <button type="submit" class="btn-action" style="height: 48px; justify-content: center; background: var(--text-main); color: #000;">บันทึก</button>
        </form>
    </div>

    <div class="stats-grid">
        <div class="stat-card glass-panel">
            <div class="stat-icon"><i class="fa-solid fa-clapperboard"></i></div>
            <div class="stat-info"><h3 id="statTotal">0</h3><p>เรื่องทั้งหมด</p></div>
        </div>
        <div class="stat-card glass-panel">
            <div class="stat-icon"><i class="fa-regular fa-calendar-check"></i></div>
            <div class="stat-info"><h3 id="statActiveTabCount">0</h3><p>ในหมวดที่เลือก</p></div>
        </div>
        <div class="stat-card glass-panel">
            <div class="stat-icon"><i class="fa-solid fa-chart-line"></i></div>
            <div class="stat-info"><h3 id="statTopYear">-</h3><p>ปีที่ดูมากที่สุด</p></div>
        </div>
    </div>

    <!-- Advanced Charts Section -->
    <div class="charts-container">
        <!-- Chart 1: Bar Chart (Monthly) -->
        <div class="chart-box glass-panel">
            <div class="chart-header"><i class="fa-solid fa-chart-column"></i> สถิติการดูรายเดือน</div>
            <div class="canvas-wrapper"><canvas id="monthlyChart"></canvas></div>
        </div>
        
        <!-- Chart 2: Doughnut Chart (Ratings) -->
        <div class="chart-box glass-panel">
            <div class="chart-header"><i class="fa-solid fa-chart-pie"></i> สัดส่วนคะแนนดาว</div>
            <div class="canvas-wrapper"><canvas id="ratingChart"></canvas></div>
        </div>

        <!-- Chart 3: Horizontal Bar Chart (Decades) -->
        <div class="chart-box glass-panel full-width">
            <div class="chart-header"><i class="fa-solid fa-timeline"></i> ยุคของภาพยนตร์ที่ดู (Decade Tracker)</div>
            <div class="canvas-wrapper" style="height: 250px;"><canvas id="decadeChart"></canvas></div>
        </div>
    </div>

    <div class="controls-panel glass-panel">
        <div class="year-tabs" id="yearTabs">
            <button class="tab-btn active" onclick="selectYear('ALL')">ทั้งหมด</button>
            <button class="tab-btn" onclick="selectYear('2026')">2026</button>
            <button class="tab-btn" onclick="selectYear('2025')">2025</button>
            <button class="tab-btn" onclick="selectYear('2024')">2024</button>
            <button class="tab-btn" onclick="selectYear('2023')">2023</button>
            <button class="tab-btn" onclick="selectYear('2022')">2022</button>
            <button class="tab-btn" onclick="selectYear('2021')">2021</button>
        </div>

        <div class="filter-row">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อหนัง..." oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <select id="sortSelect" onchange="applyFilters()">
                    <option value="DATE_DESC">เพิ่มล่าสุด</option>
                    <option value="TITLE_ASC">ชื่อ (A-Z)</option>
                    <option value="RELEASE_DESC">ปีฉาย (ใหม่สุด)</option>
                </select>
                <div class="view-btn-group">
                    <button class="view-btn active" id="btnGridView" onclick="switchView('GRID')"><i class="fa-solid fa-border-all"></i></button>
                    <button class="view-btn" id="btnTableView" onclick="switchView('TABLE')"><i class="fa-solid fa-list-ul"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="moviesGrid" class="movies-grid"></div>
    
    <div id="tableWrapper" class="table-wrapper glass-panel">
        <table>
            <thead>
                <tr><th style="width: 60px;">#</th><th>ชื่อภาพยนตร์</th><th>ปีที่ฉาย</th><th>วันที่รับชม</th></tr>
            </thead>
            <tbody id="movieTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 🔑 API Keys
    const TMDB_API = '7b0e42848add2ef42a3614c6a40b801b';
    const OMDB_API = '941b28f2';

    const SHEET_IDS = {
        '2026': '1ZdV8YXXQAqXegMwJl3PpqHItTI6GXyx8RU2ZQmhF7Tg', 
        '2025': '1dNxvYfZUN-XBryNf_QB9DnaBM5Fc8TRg4k9Niv1y1hA',
        '2024': '10uRvpV3fI4tcGmCoTS4cSpCd32wGIEIuR6RpFRh3h68',
        '2023': '1TjOzc2WY9VOu-PujXk7QJj-G57Y1hcvPof7i6imsHy0',
        '2022': '1CTjHtjL3D0P5wn8vq8VX10gvy3xGaLog_Kv-z7kC9Bw',
        '2021': '1OZBdY4QRWriPuybGGxD4Wk2LomVcuuYCYICaK_b7oKo'
    };

    let allMoviesData = {};
    let activeYear = 'ALL';
    let activeView = 'GRID';
    let observer = null;
    
    // ตัวแปรกราฟ
    let chartMonthly = null;
    let chartRating = null;
    let chartDecade = null;

    // ตั้งค่าพื้นฐานให้ Chart.js (Apple Glass Theme)
    Chart.defaults.color = '#8e8e93';
    Chart.defaults.font.family = "'Inter', 'Noto Sans Thai', sans-serif";
    Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(25, 25, 25, 0.9)';
    Chart.defaults.plugins.tooltip.padding = 12;
    Chart.defaults.plugins.tooltip.cornerRadius = 10;

    function clearImageCache() {
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('meta_')) keysToRemove.push(key);
        }
        keysToRemove.forEach(k => localStorage.removeItem(k));
        alert('เคลียร์แคชรูปภาพเรียบร้อยแล้ว!');
        applyFilters(); 
    }

    function cleanMovieTitle(title) { return title.replace(/\s*\(.*?\)\s*/g, '').trim(); }

    function openIMDB(imdbID, title) {
        if (imdbID && imdbID !== 'N/A') {
            window.open(`https://www.imdb.com/title/${imdbID}/`, '_blank');
        } else {
            const searchTitle = cleanMovieTitle(title);
            window.open(`https://www.imdb.com/find?q=${encodeURIComponent(searchTitle)}`, '_blank');
        }
    }

    // --- API Fetching: TMDB First ---
    async function fetchPosterAndRating(rawTitle, year) {
        const title = cleanMovieTitle(rawTitle); 
        const cacheKey = `meta_v6_${title.toLowerCase()}_${year}`; 
        
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed.poster || parsed.rating) return parsed;
        }

        let meta = { poster: null, rating: null, source: null, imdbID: null };

        try {
            // 1. TMDB
            let tmdbUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API}&query=${encodeURIComponent(title)}`;
            let res = await fetch(tmdbUrl);
            let data = await res.json();
            
            if (data.results && data.results.length > 0) {
                let match = data.results[0];
                if (year && year !== '-' && !isNaN(parseInt(year))) {
                    const exactMatch = data.results.find(m => m.release_date && m.release_date.startsWith(year));
                    if (exactMatch) match = exactMatch;
                }
                if (match.poster_path) meta.poster = `https://image.tmdb.org/t/p/w500${match.poster_path}`;
                if (match.vote_average > 0) { meta.rating = match.vote_average.toFixed(1); meta.source = 'TMDB'; }
            }

            // 2. OMDb Fallback
            if (!meta.poster || !meta.rating) {
                let omdbUrl = `https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${OMDB_API}`;
                let omdbRes = await fetch(omdbUrl);
                let omdbData = await omdbRes.json();
                
                if (omdbData.Response === "True") {
                    if (!meta.poster && omdbData.Poster && omdbData.Poster !== "N/A") meta.poster = omdbData.Poster;
                    if (!meta.rating && omdbData.imdbRating && omdbData.imdbRating !== "N/A") { 
                        meta.rating = omdbData.imdbRating; 
                        meta.source = 'IMDb'; 
                    }
                    meta.imdbID = omdbData.imdbID;
                }
            }
        } catch (e) { console.error("API Fetch Error:", e); }

        if (meta.poster || meta.rating) {
            localStorage.setItem(cacheKey, JSON.stringify(meta));
        }
        
        return meta;
    }

    function toggleAddForm() { document.getElementById('addFormPanel').classList.toggle('show'); }

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        const result = [];
        for (let line of lines) {
            if (!line.trim()) continue;
            let row = [], insideQuotes = false, entry = '';
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    if (insideQuotes && line[i+1] === '"') { entry += '"'; i++; } 
                    else { insideQuotes = !insideQuotes; }
                } else if (char === ',' && !insideQuotes) {
                    row.push(entry.trim()); entry = '';
                } else { entry += char; }
            }
            row.push(entry.trim());
            result.push(row);
        }
        return result;
    }

    function extractMoviesFromCSV(csvRows, year) {
        let headerIdx = -1;
        let colMap = { title: 2, releaseYear: 3, dateWatched: 4, rating: 5 };

        for (let i = 0; i < Math.min(csvRows.length, 6); i++) {
            const row = csvRows[i];
            if (!row) continue;
            for (let j = 0; j < row.length; j++) {
                const cell = row[j].toLowerCase();
                if (cell.includes('name') || cell.includes('ชื่อเรื่อง') || cell.includes('title')) { headerIdx = i; colMap.title = j; }
                if (cell.includes('release') || (cell.includes('ปี') && !cell.includes('ดู'))) { colMap.releaseYear = j; }
                if (cell.includes('date') || cell.includes('วันที่') || cell.includes('ดู')) { colMap.dateWatched = j; }
                if (cell.includes('rating') || cell.includes('คะแนน') || cell.includes('⭐')) { colMap.rating = j; }
            }
            if (headerIdx !== -1) break;
        }

        const startRow = headerIdx !== -1 ? headerIdx + 1 : 3;
        const movies = [];

        for (let i = startRow; i < csvRows.length; i++) {
            const row = csvRows[i];
            if (!row || row.length <= Math.max(colMap.title, colMap.releaseYear, colMap.dateWatched)) continue;
            
            const title = row[colMap.title] ? row[colMap.title].replace(/^"|"$/g, '').trim() : '';
            if (!title || title.toLowerCase() === 'name' || title === 'หนังที่ฉันดู' || title === 'ชื่อเรื่อง') continue;

            const relYear = row[colMap.releaseYear] ? row[colMap.releaseYear].replace(/^"|"$/g, '').trim() : year;
            const dateWatched = row[colMap.dateWatched] ? row[colMap.dateWatched].replace(/^"|"$/g, '').trim() : '-';
            const rawRating = row[colMap.rating] ? row[colMap.rating].replace(/^"|"$/g, '').trim() : '';

            // ดึงเฉพาะดาวเพื่อใช้ทำกราฟ
            let ratingNum = 0;
            if (rawRating) {
                const stars = rawRating.match(/[⭐★☆✰]/g);
                if (stars) {
                    let count = 0;
                    for (let c of rawRating.replace(/["']/g, '')) {
                        if (c === '⭐' || c === '★' || c === '⭐️') count++;
                        else break;
                    }
                    ratingNum = count <= 5 ? count : 0;
                }
            }

            movies.push({ t: title, y: relYear || year, d: dateWatched, r: ratingNum, yearWatched: year, isCustom: false });
        }
        return movies;
    }

    async function fetchLiveData() {
        const statusText = document.getElementById('statusText');
        statusText.innerHTML = '<i class="fa-solid fa-rotate fa-spin" style="color:#ffffff;"></i> โหลดข้อมูล...';
        
        let savedCustomData = JSON.parse(localStorage.getItem('custom_movies_data')) || {};
        let successCount = 0;
        const fetchedData = {};

        for (const [yr, sid] of Object.entries(SHEET_IDS)) {
            const url = `https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:csv`;
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const csvText = await res.text();
                    let sheetMovies = extractMoviesFromCSV(parseCSV(csvText), yr);
                    if (savedCustomData[yr]) sheetMovies = savedCustomData[yr].concat(sheetMovies);
                    fetchedData[yr] = sheetMovies;
                    successCount++;
                }
            } catch (err) {
                if (savedCustomData[yr]) fetchedData[yr] = savedCustomData[yr];
            }
        }

        allMoviesData = fetchedData;
        statusText.innerHTML = `<i class="fa-solid fa-check" style="color:var(--success-color);"></i> ซิงค์สำเร็จ`;
        setTimeout(() => statusText.innerHTML = 'พร้อมใช้งาน', 3000);

        updateStats();
        applyFilters();
    }

    function addNewMovie(event) {
        event.preventDefault();
        const title = document.getElementById('inputTitle').value.trim();
        const releaseYear = document.getElementById('inputReleaseYear').value.trim();
        const dateWatched = document.getElementById('inputDateWatched').value.trim();
        const targetYear = document.getElementById('inputTargetYear').value;

        const newMovie = { t: title, y: releaseYear, d: dateWatched, r: 0, yearWatched: targetYear, isCustom: true };
        if (!allMoviesData[targetYear]) allMoviesData[targetYear] = [];
        allMoviesData[targetYear].unshift(newMovie);

        let savedCustomData = JSON.parse(localStorage.getItem('custom_movies_data')) || {};
        if (!savedCustomData[targetYear]) savedCustomData[targetYear] = [];
        savedCustomData[targetYear].unshift(newMovie);
        localStorage.setItem('custom_movies_data', JSON.stringify(savedCustomData));

        document.getElementById('addMovieForm').reset();
        toggleAddForm();
        selectYear(targetYear);
    }

    function selectYear(yr) {
        activeYear = yr;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === (yr === 'ALL' ? 'ทั้งหมด' : yr));
        });
        updateStats();
        applyFilters();
    }

    function switchView(view) {
        activeView = view;
        document.getElementById('btnGridView').classList.toggle('active', view === 'GRID');
        document.getElementById('btnTableView').classList.toggle('active', view === 'TABLE');
        document.getElementById('moviesGrid').style.display = view === 'GRID' ? 'grid' : 'none';
        document.getElementById('tableWrapper').style.display = view === 'TABLE' ? 'block' : 'none';
    }

    function updateStats() {
        let allList = [], activeList = [];
        const yearCounts = {};
        for (const [yr, list] of Object.entries(allMoviesData)) {
            allList = allList.concat(list);
            if (activeYear === 'ALL' || activeYear === yr) activeList = activeList.concat(list);
            if (list.length > 0) yearCounts[yr] = list.length;
        }
        document.getElementById('statTotal').innerText = allList.length;
        document.getElementById('statActiveTabCount').innerText = activeList.length;

        let maxYr = '-', maxCount = 0;
        for (const [yr, count] of Object.entries(yearCounts)) {
            if (count > maxCount) { maxCount = count; maxYr = `${yr} (${count})`; }
        }
        document.getElementById('statTopYear').innerText = maxYr;
    }

    // ---------------- วาดกราฟสถิติ (Chart.js) ----------------
    function drawCharts(movies) {
        const monthsMap = {'jan':0, 'ม.ค.':0, 'feb':1, 'ก.พ.':1, 'mar':2, 'มี.ค.':2, 'apr':3, 'เม.ย.':3, 'may':4, 'พ.ค.':4, 'jun':5, 'มิ.ย.':5, 'jul':6, 'ก.ค.':6, 'aug':7, 'ส.ค.':7, 'sep':8, 'ก.ย.':8, 'oct':9, 'ต.ค.':9, 'nov':10, 'พ.ย.':10, 'dec':11, 'ธ.ค.':11};
        const monthCounts = new Array(12).fill(0);
        const ratingCounts = {5:0, 4:0, 3:0, 2:0, 1:0, unrated:0};
        const decadeCounts = {};

        movies.forEach(m => {
            if(m.d && m.d !== '-') {
                const monthStr = m.d.substring(0,3).toLowerCase();
                if(monthsMap[monthStr] !== undefined) monthCounts[monthsMap[monthStr]]++;
            }
            if (m.r >= 1 && m.r <= 5) ratingCounts[m.r]++; else ratingCounts.unrated++;
            const yearNum = parseInt(m.y);
            if (!isNaN(yearNum) && yearNum > 1900 && yearNum < 2100) {
                const decade = Math.floor(yearNum / 10) * 10;
                decadeCounts[decade] = (decadeCounts[decade] || 0) + 1;
            }
        });

        // 1. กราฟรายเดือน
        if(chartMonthly) chartMonthly.destroy();
        const ctxMonthly = document.getElementById('monthlyChart').getContext('2d');
        const gradientBlue = ctxMonthly.createLinearGradient(0, 0, 0, 400);
        gradientBlue.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
        gradientBlue.addColorStop(1, 'rgba(255, 255, 255, 0.2)');

        chartMonthly = new Chart(ctxMonthly, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                datasets: [{ data: monthCounts, backgroundColor: gradientBlue, borderRadius: 6, borderWidth: 0 }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { stepSize: 1 } }, x: { grid: { display: false } } }
            }
        });

        // 2. กราฟโดนัท เรตติ้ง
        if(chartRating) chartRating.destroy();
        const ctxRating = document.getElementById('ratingChart').getContext('2d');
        chartRating = new Chart(ctxRating, {
            type: 'doughnut',
            data: {
                labels: ['5 ดาว', '4 ดาว', '3 ดาว', '2 ดาว', '1 ดาว', 'ไม่ได้ให้'],
                datasets: [{
                    data: [ratingCounts[5], ratingCounts[4], ratingCounts[3], ratingCounts[2], ratingCounts[1], ratingCounts.unrated],
                    backgroundColor: ['#ffffff', '#a3a3a3', '#737373', '#525252', '#404040', 'rgba(255,255,255,0.05)'],
                    borderWidth: 1, borderColor: '#111'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false, cutout: '70%',
                plugins: { legend: { position: 'right', labels: { boxWidth: 12, usePointStyle: true, color: '#fff' } } }
            }
        });

        // 3. กราฟทศวรรษ
        if(chartDecade) chartDecade.destroy();
        const ctxDecade = document.getElementById('decadeChart').getContext('2d');
        const sortedDecades = Object.keys(decadeCounts).sort();
        const gradientGray = ctxDecade.createLinearGradient(0, 0, 800, 0);
        gradientGray.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
        gradientGray.addColorStop(1, 'rgba(255, 255, 255, 0.1)');

        chartDecade = new Chart(ctxDecade, {
            type: 'bar',
            data: {
                labels: sortedDecades.length > 0 ? sortedDecades.map(d => `${d}s`) : ['No Data'],
                datasets: [{ data: sortedDecades.length > 0 ? sortedDecades.map(d => decadeCounts[d]) : [0], backgroundColor: gradientGray, borderRadius: 6 }]
            },
            options: {
                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { stepSize: 1 } }, y: { grid: { display: false } } }
            }
        });
    }

    function applyFilters() {
        let movies = [];
        for (const [yr, list] of Object.entries(allMoviesData)) {
            if (activeYear === 'ALL' || activeYear === yr) movies = movies.concat(list);
        }

        drawCharts(movies); // อัปเดตกราฟ

        const search = document.getElementById('searchInput').value.toLowerCase();
        const sort = document.getElementById('sortSelect').value;

        if (search) movies = movies.filter(m => m.t.toLowerCase().includes(search));

        movies.sort((a, b) => {
            if (sort === 'TITLE_ASC') return a.t.localeCompare(b.t);
            if (sort === 'RELEASE_DESC') return (b.y || 0) - (a.y || 0);
            return 0; // Default
        });

        renderMovies(movies);
    }

    function renderMovies(movies) {
        const grid = document.getElementById('moviesGrid');
        const tbody = document.getElementById('movieTableBody');
        grid.innerHTML = ''; tbody.innerHTML = '';

        if (movies.length === 0) {
            const emptyHTML = `<div class="empty-state"><i class="fa-solid fa-film fa-3x" style="opacity:0.2; margin-bottom:15px;"></i><p style="font-weight: 500;">No movies found.</p></div>`;
            grid.innerHTML = emptyHTML;
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; border:none;">${emptyHTML}</td></tr>`;
            return;
        }

        if(observer) observer.disconnect();
        observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const title = card.dataset.title;
                    const year = card.dataset.year;
                    
                    fetchPosterAndRating(title, year).then(meta => {
                        card.onclick = () => openIMDB(meta.imdbID, title);

                        if (meta.poster && meta.poster !== "N/A") {
                            const img = card.querySelector('.poster-img');
                            img.src = meta.poster;
                            img.onload = () => {
                                img.style.display = 'block';
                                card.querySelector('.poster-placeholder').style.display = 'none';
                            };
                        }
                        if (meta.rating && meta.rating !== "N/A") {
                            const badge = card.querySelector('.rating-badge');
                            badge.querySelector('.rating-val').innerText = meta.rating;
                            badge.style.display = 'flex';
                        }
                    });
                    obs.unobserve(card);
                }
            });
        }, { rootMargin: '200px' });

        movies.forEach((m, idx) => {
            const customTag = m.isCustom ? `<span class="custom-badge">Added</span>` : '';
            
            const card = document.createElement('div');
            card.className = 'movie-card fade-in';
            card.style.animationDelay = `${Math.min(idx * 0.02, 0.4)}s`;
            card.dataset.title = m.t;
            card.dataset.year = m.y;
            card.innerHTML = `
                <div class="poster-wrapper">
                    <div class="poster-placeholder">
                        <i class="fa-solid fa-film fa-2x" style="opacity:0.5;"></i>
                    </div>
                    <img class="poster-img" alt="${m.t}" loading="lazy">
                    <div class="rating-badge"><i class="fa-solid fa-star"></i> <span class="rating-val"></span></div>
                </div>
                <div class="movie-info">
                    <h3 class="movie-title">${m.t} <i class="fa-solid fa-arrow-up-right-from-square imdb-link-icon"></i></h3>
                    <div class="movie-meta">
                        <span class="release-year">${m.y}</span>
                        ${customTag}
                    </div>
                </div>
            `;
            grid.appendChild(card);
            observer.observe(card);

            const tr = document.createElement('tr');
            tr.className = 'fade-in';
            tr.style.animationDelay = `${Math.min(idx * 0.01, 0.2)}s`;
            tr.onclick = () => { fetchPosterAndRating(m.t, m.y).then(meta => openIMDB(meta.imdbID, m.t)); };
            tr.innerHTML = `
                <td style="color: var(--text-muted);">${idx + 1}</td>
                <td class="table-title">${m.t} <i class="fa-solid fa-arrow-up-right-from-square table-imdb-link"></i> ${customTag}</td>
                <td>${m.y}</td>
                <td style="color: var(--text-muted);">${m.d}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = () => { fetchLiveData(); };
</script>
