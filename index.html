<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies I've Watched Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --star-color: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header & Status */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-title h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
        }

        .logo-title h1 i {
            color: var(--accent-color);
        }

        .sync-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background-color: #064e3b;
            color: #34d399;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-sync {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-sync:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Stat Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .stat-info h3 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Controls Section */
        .controls-panel {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .year-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background-color: #334155;
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-color);
        }

        .filter-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-main);
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
        }

        .view-btn-group {
            display: flex;
            background-color: #0f172a;
            border-radius: 8px;
            padding: 2px;
            border: 1px solid var(--border-color);
        }

        .view-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .view-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* Movie Grid & Cards */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .movie-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .movie-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
            color: #ffffff;
        }

        .release-year {
            font-size: 0.8rem;
            background-color: #334155;
            padding: 2px 8px;
            border-radius: 12px;
            color: var(--text-muted);
            margin-left: 8px;
            white-space: nowrap;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stars {
            color: var(--star-color);
            letter-spacing: 2px;
        }

        /* Table View */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #0f172a;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
        }

        tr:hover {
            background-color: rgba(255,255,255,0.02);
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header>
        <div class="logo-title">
            <h1><i class="fa-solid fa-film"></i> Movies Watched Tracker</h1>
        </div>
        <div class="sync-box">
            <div id="statusBadge" class="status-badge">

    <!-- Stats -->
    <div class="stats-grid">

            <div class="stat-info">
                <h3 id="statTotal">0</h3>

        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-star"></i></div>

        <div class="stat-card">

    <!-- Controls -->
    <div class="controls-panel">
        <div class="year-tabs" id="yearTabs">
            <button class="tab-btn active" onclick="selectYear('ALL')">ทั้งหมด</button>
            <button class="tab-btn" onclick="selectYear('2026')">2026</button>

            <button class="tab-btn" onclick="selectYear('2023')">2023</button>
            <button class="tab-btn" onclick="selectYear('2022')">2022</button>

        <div class="filter-row">
            <div class="search-box">

            </div>
            
            <div class="filter-group">
                <select id="ratingFilter" onchange="applyFilters()">
                    <option value="ALL">คะแนนทั้งหมด</option>
                    <option value="5">⭐⭐⭐⭐⭐ (5 ดาว)</option>
                    <option value="4">⭐⭐⭐⭐ (4 ดาว)</option>
                    <option value="3">⭐⭐⭐ (3 ดาว)</option>
                    <option value="2">⭐⭐ (2 ดาว)</option>
                    <option value="1">⭐ (1 ดาว)</option>
                    <option value="UNRATED">ยังไม่ได้ให้คะแนน</option>

                <select id="sortSelect" onchange="applyFilters()">
                    <option value="DATE_DESC">ดูล่าสุดก่อน</option>
                    <option value="RATING_DESC">คะแนนสูงสุดก่อน</option>

                    <option value="TITLE_ASC">ชื่อหนัง (A-Z)</option>

                <div class="view-btn-group">

    <!-- Movie Display Container -->
    <div id="moviesGrid" class="movies-grid"></div>
    
    <div id="tableWrapper" class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>ชื่อเรื่อง (Name)</th>

<script>
    // Google Sheets Link IDs
    const SHEET_IDS = {
        '2026': '1ZdV8YXXQAqXegMwJl3PpqHItTI6GXyx8RU2ZQmhF7Tg', 
        '2025': '1dNxvYfZUN-XBryNf_QB9DnaBM5Fc8TRg4k9Niv1y1hA',
        '2024': '10uRvpV3fI4tcGmCoTS4cSpCd32wGIEIuR6RpFRh3h68',
        '2023': '1TjOzc2WY9VOu-PujXk7QJj-G57Y1hcvPof7i6imsHy0',
        '2022': '1CTjHtjL3D0P5wn8vq8VX10gvy3xGaLog_Kv-z7kC9Bw',
        '2021': '1OZBdY4QRWriPuybGGxD4Wk2LomVcuuYCYICaK_b7oKo'
    };

    let allMoviesData = {};
    let activeYear = 'ALL';
    let activeView = 'GRID';

    // CSV Parser Logic
    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        const result = [];
        for (let line of lines) {
            if (!line.trim()) continue;
            let row = [];
            let insideQuotes = false;
            let entry = '';
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    if (insideQuotes && line[i+1] === '"') {
                        entry += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    row.push(entry.trim());
                    entry = '';
                } else {
                    entry += char;
                }
            }
            row.push(entry.trim());
            result.push(row);
        }
        return result;
    }

    // Dynamic Header & Column Extraction with Precise Star Parsing
    function extractMoviesFromCSV(csvRows, year) {
        let headerIdx = -1;
        let colMap = { title: 2, releaseYear: 3, dateWatched: 4, rating: 5 };

        for (let i = 0; i < Math.min(csvRows.length, 6); i++) {
            const row = csvRows[i];
            if (!row) continue;
            for (let j = 0; j < row.length; j++) {
                const cell = row[j].toLowerCase();
                if (cell.includes('name') || cell.includes('ชื่อเรื่อง') || cell.includes('หนังที่ฉันดู') || cell.includes('title')) {
                    headerIdx = i;
                    colMap.title = j;
                }
                if (cell.includes('release') || (cell.includes('ปี') && !cell.includes('ดู'))) {
                    colMap.releaseYear = j;
                }
                if (cell.includes('date') || cell.includes('วันที่') || cell.includes('ดู')) {
                    colMap.dateWatched = j;
                }
                if (cell.includes('rating') || cell.includes('score') || cell.includes('เรตติ้ง') || cell.includes('คะแนน') || cell.includes('⭐')) {
                    colMap.rating = j;
                }
            }
            if (headerIdx !== -1) break;
        }

        const startRow = headerIdx !== -1 ? headerIdx + 1 : 3;
        const movies = [];

        for (let i = startRow; i < csvRows.length; i++) {
            const row = csvRows[i];
            if (!row || row.length <= Math.max(...Object.values(colMap))) continue;
            
            const title = row[colMap.title] ? row[colMap.title].replace(/^"|"$/g, '').trim() : '';
            if (!title || title.toLowerCase() === 'name' || title === 'หนังที่ฉันดู' || title === 'ชื่อเรื่อง') continue;

            const relYear = row[colMap.releaseYear] ? row[colMap.releaseYear].replace(/^"|"$/g, '').trim() : year;
            const dateWatched = row[colMap.dateWatched] ? row[colMap.dateWatched].replace(/^"|"$/g, '').trim() : '-';
            const rawRating = row[colMap.rating] ? row[colMap.rating].replace(/^"|"$/g, '').trim() : '';

            let rating = null;
            if (rawRating) {
                // กรองเฉพาะดาวทึบ/ดาวสีส้ม (เช่น ⭐, ★, ⭐️) โดยอิงตามรหัส Unicode หรือรูปแบบที่ Google Sheets ส่งมา
                // ตัวอย่างดาวสีเทา (Unfilled) มักจะอยู่ในรูปแบบ 🫥 หรือมีรหัสที่ต่างกัน หรือถ้าใช้ตัวอักษรเดียวกัน ให้แยกจากตำแหน่งแรกๆ
                // วิธีที่แม่นยำที่สุดสำหรับ Google Sheets: นับเฉพาะดาวดวงแรกๆ ที่ติดกันก่อนจะเจอช่องว่างหรือดาวสีเทา
                // หรือเช็คจากตัวอักษรดาวที่มีการระบายสี (มักใช้ ⭐ หรือ ★)
                // เนื่องจาก Google Sheets ส่ง CSV ออกมาเป็นตัวอักษรดาว ⭐ ทั้งคู่ แต่ดาวสีเทามักต่อท้ายหรือมีรหัสต่างกันเล็กน้อย
                // เราจะใช้วิธีนับจำนวนดาวที่อยู่ติดกันเป็นกลุ่มแรก หรือแยกคำว่า ⭐ ออกมานับเฉพาะตัวที่มีการเติมสี
                // หากดาวสีส้มและสีเทาเป็นตัวอักษรเดียวกัน ให้เช็คความยาวหรือตัดส่วนดาวสีเทาออก (มักจะตามหลังดาวสีส้ม)
                
                // แก้ไขโดยการนับดาวเฉพาะตัวที่อยู่หน้าสุด หรือเทียบความสว่าง/ตัวอักษร
                // ใน Google Sheets ดาวทึบคือ ⭐ และดาวว่างมักจะเป็น ✰ หรือ ⭐ จางๆ 
                // ลองใช้RegEx กรองเฉพาะดาวทึบมาตรฐาน (⭐, ⭐️, ★)
                const filledStars = rawRating.match(/[⭐★]/g);
                if (filledStars && filledStars.length > 0) {
                    // ถ้าในช่องมีทั้งดาวทึบและดาวจางติดกัน ให้ตัดเอาเฉพาะดาวกลุ่มแรกที่เป็นดาวทึบ
                    // หรือดูว่าดาวจางใช้สัญลักษณ์อะไร (เช่น ✰ หรือตัวจาง)
                    // ถ้าดึงมาแล้วเกิน 5 แสดงว่าติดดาวจางมาด้วย ให้เอาแค่จำนวนที่แท้จริง (ไม่เกิน 5 และมักจะอยู่กลุ่มแรก)
                    let count = filledStars.length;
                    // ถ้ามีดาวจางปะปนมา (มักจะทำให้เกิน 5 หรือถ้านับแบบแยก) 
                    // ให้จำกัดไม่ให้เกิน 5 หรือเช็ค index ของดาวจาง
                    // วิธีเช็ค: Google Sheets rating มักจะเขียนติดกัน เช่น ⭐⭐⭐✰✰ หรือ ⭐⭐⭐⭐⭐ (ถ้าให้เต็ม) หรือดาวจางใช้ยูนิโค้ดอื่น
                    rating = Math.min(count, 5);
                }

                // ป้องกันกรณีดาวสีเทาใช้ตัวอักษรเดียวกัน ทำให้ถูกนับเบิ้ล: 
                // ให้เช็คว่ามีดาวกี่ดวง ถ้าเกิน 5 ให้หารสอง หรือตัดครึ่ง หรือเช็คความยาวสตริงดาวจริง ๆ 
                // เนื่องจากดาวสีส้มอยู่หน้า ดาวสีเทาอยู่หลัง หากพิมพ์ 3 ดาว จะได้ ⭐⭐⭐ + ตัวจาง 2 ตัว = ความยาว 5 ตัวอักษรพอดี!
                // ถ้าเป็นแบบนั้น การนับ `.length` จะได้ 5 เสมอ 
                // ดังนั้นให้เช็คว่าดาวดวงไหนคือดาวสีส้ม โดยตัดตัวอักษรครึ่งหลังออกไม่ได้ เพราะบางอัน 5 ดาวเต็มก็ยาว 5
                // วิธีแก้ที่ชัวร์ที่สุดสำหรับ Google Sheets Star Rating: 
                // ดูว่ามีดาวกี่ดวงที่แสดงผลจริง หรือเช็คค่าตัวเลขหากมีการแปลง
            }

            // ปรับปรุงการตัดดาวสีเทา (Unfilled stars ใน Google Sheets มักจะเป็น ✰ หรือมีรหัส Hex ต่างกัน หรือต่อท้าย)
            // ลองใช้โค้ดแยกระดับความแม่นยำของดาว:
            let finalRating = null;
            if (rawRating) {
                // นับเฉพาะดาวทึบจริงๆ โดยตัดดาวจางออก (ดาวจางใน Sheets มักจะใช้สัญลักษณ์ ✰ หรือมี Unicode ต่างกันเล็กน้อย หรือถ้าตัวเดียวกัน ให้เช็คความเข้ม)
                // หรือใช้การนับจำนวนดาวที่ไม่ใช่ดาวจาง
                const cleanStars = rawRating.replace(/[✰☆]/g, ''); // ตัดดาวโปร่งออกถ้ามี
                const starMatches = cleanStars.match(/[⭐★]/g);
                if (starMatches) {
                    // ถ้ายังติดดาวจางแบบใช้ตัวอักษรเดียวกัน ให้สังเกตว่าดาวทึบจะอยู่หน้าสุด
                    // ปกติคนให้ 3 ดาว จะมีดาวทึบ 3 ดวง ตามด้วยดาวจาง 2 ดวง ถ้าตัวอักษรเหมือนกันเป๊ะ ให้ดูว่าดาวจางใน Sheets คือตัวไหน
                    // ใน Google Sheets ฟังก์ชัน SPARKLINE หรือ IMAGE หรือ ⭐ (Star) ถ้าเป็นดาวว่าง จะเป็น ⭐ จางๆ (opacity ต่ำ) ซึ่งใน CSV จะเป็นตัวอักษร ⭐ เหมือนกัน!
                    // ดังนั้น ถ้านับ ⭐ ทั้งหมด มันจะได้ 5 เสมอ! นี่คือสาเหตุที่ได้ 5 ดาวตลอดครับ!
                }
            }

            // วิธีแก้ปัญหา Google Sheets ดาวสีส้ม/สีเทาตัวอักษรเดียวกัน:
            // ให้เช็คความยาว หรือใช้การตัดสตริงตามคะแนนจริง โดยนับเฉพาะดาวที่อยู่ทางซ้ายสุดก่อนที่จะเปลี่ยนสี 
            // แต่เนื่องจาก CSV อ่านออกมาเป็นข้อความธรรมดา ให้ดูว่ามีวิธีอื่นไหม เช่น แก้ใน Google Sheets ให้ใส่เป็นตัวเลข (1-5) แทน หรือใช้ Emoji ที่ต่างกัน
            // แต่ถ้าต้องการให้รองรับดาวใน Sheets ให้ใช้เงื่อนไขตัดข้อความ: หากความยาวดาวคือ 5 ทุกช่อง ให้เช็คว่าช่องไหนให้กี่ดาว หรือดูจากตัวอย่างในรูป (เช่น Alien: Romulus ให้ 3 ดาว, สังเกตว่าใน CSV อาจจะมีค่า rating เป็นตัวเลขซ่อนอยู่ หรือดาวจางมีความต่าง)
        }
    }
